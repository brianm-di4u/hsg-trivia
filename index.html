.standings { width: 100%; border-collapse: collapse; margin-top: 12px; } .standings th, .standings td { padding: 6px; border-bottom: 1px solid var(--color-border); text-align: left; }
.standings td .tok { vertical-align: middle; }
.legend { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.legend li { display: flex; gap: 10px; align-items: center; } .legend small { display: block; color: var(--color-muted); }
.rules { padding-left: 20px; } .rules li { margin: 4px 0; } .keys { line-height: 2; }

/* ---------- mobile ---------- */
@media (max-width: 760px) {
  :root { --panel-h: 50dvh; }
  body.scene-game #stage { right: 0; bottom: auto; height: calc(100dvh - var(--top) - var(--panel-h)); }
  body.scene-game #panel { top: auto; bottom: 0; left: 0; width: auto; height: var(--panel-h); border-left: 0; border-top: 2px solid var(--color-border); padding: 10px; gap: 10px; }
  body.scene-game #modal { right: 0; padding: 8px; align-items: flex-end; }
  .sheet { max-height: calc(100dvh - var(--top) - 16px); }
  .answers { grid-template-columns: 1fr; }
  .qtext { font-size: 1.12rem; }
  .page { padding: 12px 10px; }
  .page-card { padding: 16px; }
  .mcard, .qcard { padding: 14px; }
  .seat { grid-template-columns: 26px minmax(0, 1fr) 128px 44px; gap: 6px; }
  .eras, .legend, .passport .stamps { grid-template-columns: 1fr; }
  .menu.small { grid-template-columns: 1fr 1fr; }
  .dests { max-height: none; }
  .pc-greet { font-size: 1.6rem; }
  .pc-text { margin-right: 0; }
  .brand-text { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .timer .bar { transition: none; } }

</style>

<script>const QUESTIONS = {"version":2,"categories":["History","Places & Landmarks","Nature & Lakes","Sports","People","Food & Culture","Entertainment","Legends & Oddities"],"questions":[{"id":"hs-0001","category":"History","difficulty":"easy","era":"frontier","question":"On what date did President Andrew Jackson sign the act reserving the hot springs in Arkansas?","answer":"April 20, 1832","wrong":["March 4, 1921","July 4, 1836","March 1, 1872"],"explanation":"Jackson signed the act on April 20, 1832, setting aside the springs and four surrounding sections.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0002","category":"History","difficulty":"easy","era":"frontier","question":"How many years older is the 1832 Hot Springs Reservation than Yellowstone National Park?","answer":"40 years","wrong":["10 years","25 years","64 years"],"explanation":"NPS calls Hot Springs the oldest national park among current park units, predating Yellowstone by forty years.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0003","category":"History","difficulty":"easy","era":"frontier","question":"Which president sent William Dunbar and George Hunter to explore the Ouachita country and its hot springs?","answer":"Thomas Jefferson","wrong":["James Madison","John Adams","Andrew Jackson"],"explanation":"It was one of only four ventures into the Louisiana Purchase commissioned by Jefferson.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/","confidence":"confirmed"},{"id":"hs-0004","category":"History","difficulty":"easy","era":"frontier","question":"What did William Dunbar call the Arkansas hot springs in his August 1804 letter to Thomas Jefferson?","answer":"\"The boiling springs\"","wrong":["\"The steaming fountains\"","\"The vapor valley\"","\"The healing waters\""],"explanation":"On Aug. 17, 1804, Dunbar wrote Jefferson about \"the boiling springs.\"","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/","confidence":"confirmed"},{"id":"hs-0005","category":"History","difficulty":"hard","era":"frontier","question":"How much money did Congress appropriate for the 1804–05 Dunbar–Hunter expedition to the hot springs?","answer":"$3,000","wrong":["$300","$30,000","$300,000"],"explanation":"Congress appropriated $3,000 for the expedition.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/","confidence":"confirmed"},{"id":"hs-0006","category":"History","difficulty":"medium","era":"frontier","question":"What injured George Hunter on the 1804 expedition to the Arkansas hot springs?","answer":"His own pistol went off","wrong":["A bear attack","A fall into a hot spring","A capsized boat"],"explanation":"On Nov. 22, 1804, Hunter's pistol discharged, hurting his thumb and two fingers.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/","confidence":"confirmed"},{"id":"hs-0007","category":"History","difficulty":"medium","era":"frontier","question":"From which state did the Belding family come in 1828 to build a small hotel at Hot Springs?","answer":"Massachusetts","wrong":["Virginia","Kentucky","Louisiana"],"explanation":"Ludovicus Belding and his family came from Massachusetts in 1828 and built a small hotel for visitors to the springs.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0008","category":"History","difficulty":"easy","era":"frontier","question":"Which Native nation ceded the land around the Arkansas hot springs to the United States in 1818?","answer":"The Quapaw","wrong":["The Caddo","The Osage","The Cherokee"],"explanation":"The Quapaw ceded the land on Aug. 24, 1818.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0009","category":"History","difficulty":"medium","era":"frontier","question":"During which dates in 1862 was Hot Springs the capital of Arkansas?","answer":"May 6 to July 14, 1862","wrong":["Jan. 1 to March 31, 1862","Aug. 1 to Oct. 31, 1862","Sept. 1 to Dec. 1, 1862"],"explanation":"Gov. Henry Rector moved state government to Hot Springs, which was the state capital from May 6 to July 14, 1862.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0010","category":"History","difficulty":"hard","era":"frontier","question":"What number New Madrid Certificate was the basis of the Rector family's claim to the Hot Springs land?","answer":"No. 467","wrong":["No. 1","No. 1832","No. 99"],"explanation":"Congress created New Madrid certificates in 1815 for land lost in the 1811-12 quakes; Certificate 467 was sold for $260, then $640, and half of it for $600.","source":"Encyclopedia of Arkansas: Rector v. United States","sourceUrl":"https://encyclopediaofarkansas.net/entries/rector-v-united-states-14155/","confidence":"confirmed"},{"id":"hs-0011","category":"History","difficulty":"easy","era":"frontier","question":"In what year was Garland County, Arkansas, created, with Hot Springs as its seat?","answer":"1873","wrong":["1836","1851","1921"],"explanation":"Garland County was created April 5, 1873, from parts of three counties.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0012","category":"History","difficulty":"hard","era":"frontier","question":"Novaculite whetstone mining began in the Hot Springs region as early as what year?","answer":"1818","wrong":["1541","1886","1921"],"explanation":"The Arkansas Archeological Survey says whetstone mining has been an Arkansas industry since the early 1800s.","source":"Arkansas Archeological Survey: Arkansas Novaculite (PDF)","sourceUrl":"https://archeology.uark.edu/wp-content/uploads/2026/04/ArkansasNovaculite-rev_acc.pdf","confidence":"confirmed"},{"id":"hs-0013","category":"History","difficulty":"easy","era":"frontier","question":"Which 1804 expedition sent by Thomas Jefferson visited the Arkansas hot springs?","answer":"The Dunbar–Hunter Expedition","wrong":["The Lewis and Clark Expedition","The Pike Expedition","The de Soto Expedition"],"explanation":"NPS: the expedition came in 1804, sent by President Jefferson to explore the southern reaches of the Louisiana Purchase.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0014","category":"History","difficulty":"hard","era":"frontier","question":"Before Garland County was created in 1873, Hot Springs' county had its seat at which town near Malvern?","answer":"Rockport","wrong":["Royal","Jessieville","Mountain Pine"],"explanation":"Garland County was formed in 1873 with Hot Springs as its seat.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/Garland-County-770","confidence":"confirmed"},{"id":"hs-0015","category":"History","difficulty":"medium","era":"gilded-spa","question":"What was the track gauge of the original Hot Springs Railroad from Malvern?","answer":"3 feet (narrow gauge)","wrong":["4 feet 8.5 inches","2 feet","5 feet"],"explanation":"The narrow-gauge line was converted to standard gauge in 1889.","source":"Encyclopedia of Arkansas: Hot Springs Railroad","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-railroad-14157","confidence":"confirmed"},{"id":"hs-0016","category":"History","difficulty":"easy","era":"gilded-spa","question":"From which town did Diamond Jo Reynolds's railroad carry visitors to Hot Springs?","answer":"Malvern","wrong":["Little Rock","Arkadelphia","Benton"],"explanation":"The line cut the 21-mile trip from Malvern from most of a day to about an hour.","source":"Encyclopedia of Arkansas: Hot Springs Railroad","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-railroad-14157","confidence":"confirmed"},{"id":"hs-0017","category":"History","difficulty":"medium","era":"gilded-spa","question":"About how long did it take to convert the Hot Springs Railroad to standard gauge on Oct. 16, 1889?","answer":"About three hours","wrong":["About three days","About three weeks","About three months"],"explanation":"The line was converted to standard gauge in about three hours, after several months of preparation.","source":"Wikipedia: Hot Springs Railroad","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_Railroad","confidence":"confirmed"},{"id":"hs-0018","category":"History","difficulty":"medium","era":"gilded-spa","question":"An 1877 Iron Mountain railroad booklet promoted Hot Springs by comparing it to which German spa?","answer":"Baden-Baden","wrong":["Carlsbad","Wiesbaden","Aachen"],"explanation":"\"The Hot Springs of Arkansas, America's Baden-Baden\" was the first booklet advertising the town.","source":"NPS: Getting to the American Spa","sourceUrl":"https://www.nps.gov/hosp/learn/kidsyouth/getting-to-hot-springs-national-park.htm","confidence":"confirmed"},{"id":"hs-0019","category":"History","difficulty":"hard","era":"gilded-spa","question":"On what date did Congress pass the act establishing the Government Free Bathhouse at Hot Springs?","answer":"Dec. 16, 1878","wrong":["April 20, 1832","March 4, 1921","June 1, 1970"],"explanation":"The Government free bathhouse for the indigent was established under an act of Congress of December 16, 1878.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm","confidence":"confirmed"},{"id":"hs-0020","category":"History","difficulty":"hard","era":"gilded-spa","question":"About how many free baths did the Hot Springs Government Free Bathhouse give in 1919?","answer":"87,040","wrong":["870","8,704","870,400"],"explanation":"Applicants swore they could not pay; a false oath carried a fine up to $25, up to 30 days in jail, or both.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm","confidence":"confirmed"},{"id":"hs-0021","category":"History","difficulty":"easy","era":"gilded-spa","question":"In 1920, what range did single-bath prices at Hot Springs' bathhouses span, before attendant fees?","answer":"50 to 80 cents","wrong":["5 to 8 cents","$5 to $8","$25 to $30"],"explanation":"Rates were fixed by the Secretary of the Interior; the 1920 scale ran from $0.50 to $0.80 per single bath.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm","confidence":"confirmed"},{"id":"hs-0022","category":"History","difficulty":"easy","era":"gilded-spa","question":"How many baths made up a standard prescribed \"course\" at Hot Springs in 1920?","answer":"21","wrong":["7","12","47"],"explanation":"A 21-bath course cost $9–$15 in 1920.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm","confidence":"confirmed"},{"id":"hs-0023","category":"History","difficulty":"medium","era":"gilded-spa","question":"What was the maximum attendant fee per single bath at Hot Springs in 1920?","answer":"20 cents","wrong":["2 cents","$2","$20"],"explanation":"Attendant fees were capped at 20 cents a bath or $4 a course.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm","confidence":"confirmed"},{"id":"hs-0024","category":"History","difficulty":"easy","era":"gilded-spa","question":"The Army and Navy Hospital that opened at Hot Springs in 1887 was the nation's first of what kind?","answer":"Joint Army-Navy general hospital","wrong":["Confederate veterans' sanitarium","Federal polio research lab","Coast Guard hospital"],"explanation":"The Encyclopedia of Arkansas says $100,000 was approved in 1882 and the hospital opened to patients in January 1887, the first such effort in U.S. history.","source":"Encyclopedia of Arkansas: Army-Navy Hospital","sourceUrl":"https://encyclopediaofarkansas.net/entries/Arkansas-Career-Training-Institute-2236","confidence":"confirmed"},{"id":"hs-0025","category":"History","difficulty":"easy","era":"gilded-spa","question":"Which religious denomination was organized at a meeting in Hot Springs in April 1914?","answer":"The Assemblies of God","wrong":["Church of the Nazarene","Southern Baptist Convention","Church of Christ"],"explanation":"Pentecostal leaders met April 2–12, 1914, to form it.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas","confidence":"confirmed"},{"id":"hs-0026","category":"History","difficulty":"easy","era":"gilded-spa","question":"What started Hot Springs' Great Fire of Sept. 5, 1913?","answer":"Ironing that set a curtain alight","wrong":["Lightning striking a bathhouse","A locomotive boiler explosion","A casino gas leak"],"explanation":"Ulma Madlock was ironing at her Church Street home when the iron ignited a curtain.","source":"Encyclopedia of Arkansas: Fire of 1913","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1913-14306","confidence":"confirmed"},{"id":"hs-0027","category":"History","difficulty":"easy","era":"gilded-spa","question":"Why were Little Rock's fire hoses useless in Hot Springs' 1913 fire?","answer":"They didn't fit Hot Springs hydrants","wrong":["They froze solid","They were stolen on arrival","The fire train derailed"],"explanation":"Firefighters came by train from Little Rock around 8 p.m., but their hoses did not fit the local hydrants.","source":"Encyclopedia of Arkansas: Fire of 1913","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1913-14306","confidence":"confirmed"},{"id":"hs-0028","category":"History","difficulty":"medium","era":"gilded-spa","question":"In which hotel did Hot Springs' deadly Feb. 25, 1905, fire start?","answer":"The Grand Central Hotel","wrong":["The Arlington Hotel","The Eastman Hotel","The Majestic Hotel"],"explanation":"It began at about 3 a.m.; the cause was never determined, and nearly 400 buildings were destroyed.","source":"Encyclopedia of Arkansas: Fire of 1905","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1905-12570","confidence":"confirmed"},{"id":"hs-0029","category":"History","difficulty":"medium","era":"gilded-spa","question":"Roughly how many people were left homeless by Hot Springs' 1913 fire?","answer":"More than 2,500","wrong":["About 25","About 250","About 25,000"],"explanation":"The entry puts the damage at $10 million.","source":"Encyclopedia of Arkansas: Fire of 1913","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1913-14306","confidence":"confirmed"},{"id":"hs-0030","category":"History","difficulty":"easy","era":"gilded-spa","question":"Which kind of roof did Hot Springs outlaw after the 1913 fire?","answer":"Wood-shingle roofs","wrong":["Tin roofs","Slate roofs","Clay-tile roofs"],"explanation":"The town also doubled its fire department.","source":"Encyclopedia of Arkansas: Fire of 1913","sourceUrl":"https://encyclopediaofarkansas.net/entries/Hot-Springs-Fire-of-1913-14306","confidence":"confirmed"},{"id":"hs-0031","category":"History","difficulty":"medium","era":"gilded-spa","question":"Which fraternal order opened the Pythian Bathhouse and Sanitarium in Hot Springs in 1914?","answer":"The Knights of Pythias","wrong":["The Woodmen of Union","The Freemasons","The Odd Fellows"],"explanation":"It offered half-price baths to Pythian insurance members.","source":"NPS: African Americans and the Hot Springs Baths","sourceUrl":"https://www.nps.gov/articles/000/african-americans-and-the-hot-springs-baths.htm","confidence":"confirmed"},{"id":"hs-0032","category":"History","difficulty":"medium","era":"gilded-spa","question":"In what year did a great fire sweep up the valley and destroy most of the south and central downtown area of Hot Springs?","answer":"1878","wrong":["1832","1862","1923"],"explanation":"NPS says the great fire of 1878 destroyed most of the south and central downtown area.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0033","category":"History","difficulty":"medium","era":"roaring","question":"On what date did the Hot Springs Reservation become Hot Springs National Park?","answer":"March 4, 1921","wrong":["April 20, 1832","Aug. 25, 1916","Nov. 13, 1974"],"explanation":"NPS: designated the eighteenth national park on March 4, 1921; Congress had established the National Park Service on Aug. 25, 1916.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0034","category":"History","difficulty":"medium","era":"roaring","question":"When Hot Springs became a national park in 1921, it was the nation's national park number what?","answer":"18th","wrong":["1st","7th","31st"],"explanation":"It was designated the 18th national park on March 4, 1921.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0035","category":"History","difficulty":"easy","era":"roaring","question":"During WWII, Hot Springs' Army-Navy Hospital was the nation's largest center for adults with which disease?","answer":"Polio","wrong":["Malaria","Tuberculosis","Influenza"],"explanation":"It was also the Army's leading arthritis center.","source":"Encyclopedia of Arkansas: Army-Navy Hospital","sourceUrl":"https://encyclopediaofarkansas.net/entries/Arkansas-Career-Training-Institute-2236","confidence":"confirmed"},{"id":"hs-0036","category":"History","difficulty":"medium","era":"roaring","question":"Which Central Avenue gaming house did Owney Madden eventually come to own a controlling interest in?","answer":"The Southern Club","wrong":["The Starlight Room","The Silver Slipper","The Golden Crown Club"],"explanation":"Madden eventually came to own a controlling interest in the Southern Club, a gaming house on Central Avenue.","source":"Encyclopedia of Arkansas: Owney Madden","sourceUrl":"https://encyclopediaofarkansas.net/entries/owen-vincent-madden-1702/","confidence":"confirmed"},{"id":"hs-0037","category":"History","difficulty":"hard","era":"roaring","question":"About what share of 1946 primary poll-tax receipts did Judge John Miller throw out in Garland County?","answer":"Almost 24%","wrong":["About 2%","About 50%","About 90%"],"explanation":"Receipts came in alphabetical blocks of names that each appeared to be in one person's handwriting.","source":"Encyclopedia of Arkansas: GI Revolt","sourceUrl":"https://encyclopediaofarkansas.net/entries/GI-Revolt-4157","confidence":"confirmed"},{"id":"hs-0038","category":"History","difficulty":"medium","era":"roaring","question":"About how many service members did Hot Springs' WWII Army redistribution center process?","answer":"More than 32,000","wrong":["About 320","About 3,200","About 320,000"],"explanation":"The Army took over most of the hotels in August 1944; the center closed in December 1945.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas","confidence":"confirmed"},{"id":"hs-0039","category":"History","difficulty":"medium","era":"roaring","question":"On what date did the second Arlington Hotel burn?","answer":"April 5, 1923","wrong":["Sept. 5, 1913","Feb. 27, 2014","Feb. 25, 1905"],"explanation":"One fireman died and damage was about $1.6 million.","source":"Wikipedia: Arlington Hotel","sourceUrl":"https://en.wikipedia.org/wiki/Arlington_Hotel_(Hot_Springs_National_Park)","confidence":"confirmed"},{"id":"hs-0040","category":"History","difficulty":"medium","era":"roaring","question":"What was Hot Springs' Memorial Field airport first named when dedicated in 1946?","answer":"McLaughlin Field","wrong":["Fordyce Field","Couch Field","Rockefeller Field"],"explanation":"It was named for Mayor Leo McLaughlin and renamed in May 1947.","source":"City of Hot Springs: Airport History","sourceUrl":"https://www.hotspringsar.gov/476/Airport-History","confidence":"confirmed"},{"id":"hs-0041","category":"History","difficulty":"medium","era":"roaring","question":"In what year did buses replace streetcars in Hot Springs?","answer":"1938","wrong":["1888","1913","1966"],"explanation":"Horsecars had begun in the 1870s; electric cars followed in the 1890s.","source":"Wikipedia: Hot Springs Intracity Transit","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_Intracity_Transit","confidence":"confirmed"},{"id":"hs-0042","category":"History","difficulty":"easy","era":"roaring","question":"Which New Deal work program built Lake Catherine State Park near Hot Springs?","answer":"The Civilian Conservation Corps","wrong":["The Tennessee Valley Authority","The Army Corps of Engineers","The Peace Corps"],"explanation":"Wikipedia says the park was built in the 1930s by the CCC; three stone-and-wood cabins are on the National Register.","source":"Wikipedia: Lake Catherine State Park","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Catherine_State_Park","confidence":"confirmed"},{"id":"hs-0043","category":"History","difficulty":"hard","era":"roaring","question":"What did Judge John Miller call a 'statistical improbability' in ruling on Garland County's 1946 primary poll-tax receipts?","answer":"Receipts issued in alphabetical order","wrong":["Receipts printed in red ink","Receipts lacking the county clerk's seal","Receipts signed in pencil"],"explanation":"EoA says the receipts were issued in alphabetical order, in blocks of names; the GI ticket then won every seat in Garland County.","source":"Encyclopedia of Arkansas: GI Revolt","sourceUrl":"https://encyclopediaofarkansas.net/entries/gi-revolt-4157/","confidence":"confirmed"},{"id":"hs-0044","category":"History","difficulty":"medium","era":"midcentury","question":"In what year did passenger rail service to Hot Springs end?","answer":"1964","wrong":["1938","1946","1989"],"explanation":"The entry says the last passenger train to and from Hot Springs, on the Missouri Pacific, ran in 1964.","source":"Encyclopedia of Arkansas: Hot Springs Railroad","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-railroad-14157","confidence":"confirmed"},{"id":"hs-0045","category":"History","difficulty":"easy","era":"midcentury","question":"For what price was Hot Springs' Army-Navy Hospital transferred to Arkansas in 1960?","answer":"One dollar","wrong":["$1 million","$100,000","$1.5 million"],"explanation":"The grounds were sold to the state for one dollar; the hospital's military era ended April 1, 1960.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas","confidence":"confirmed"},{"id":"hs-0046","category":"History","difficulty":"hard","era":"midcentury","question":"On what date was Hot Springs' Vapors nightclub bombed?","answer":"Jan. 4, 1963","wrong":["March 11, 1959","Aug. 15, 1967","Feb. 27, 2014"],"explanation":"Twelve injuries were reported; Gazette reporters photographed the club's slot machines and craps tables.","source":"Encyclopedia of Arkansas: Vapors","sourceUrl":"https://encyclopediaofarkansas.net/entries/vapors-3998/","confidence":"confirmed"},{"id":"hs-0047","category":"History","difficulty":"medium","era":"midcentury","question":"In what year were Hot Springs' bathhouses desegregated?","answer":"1965","wrong":["1921","1946","1985"],"explanation":"School desegregation began in 1956 with a high-school auto-mechanics course.","source":"Encyclopedia of Arkansas: Hot Springs (city)","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-887/","confidence":"confirmed"},{"id":"hs-0048","category":"History","difficulty":"medium","era":"midcentury","question":"Which group bought Hot Springs' Woodmen of Union Building and ran it as the National Baptist Hotel?","answer":"The National Baptist Association","wrong":["The Knights of Pythias","The Woodmen of Union","The Assemblies of God"],"explanation":"Wikipedia says the association bought it in 1950; the hotel closed in 1981.","source":"Wikipedia: Woodmen of Union Building","sourceUrl":"https://en.wikipedia.org/wiki/Woodmen_of_Union_Building","confidence":"confirmed"},{"id":"hs-0049","category":"History","difficulty":"easy","era":"midcentury","question":"According to Wikipedia, in what year did Gov. Winthrop Rockefeller end Hot Springs' casino revival?","answer":"1967","wrong":["1946","1954","1983"],"explanation":"A casino revival during Gov. Orval Faubus's administration (1955-1967) was ended in 1967 by Republican Gov. Winthrop Rockefeller.","source":"Wikipedia: Sid McMath","sourceUrl":"https://en.wikipedia.org/wiki/Sid_McMath","confidence":"confirmed"},{"id":"hs-0050","category":"History","difficulty":"hard","era":"revival","question":"By 1979, about how many baths a year were given on Hot Springs' Bathhouse Row?","answer":"About 96,000","wrong":["About 9,600","About 960,000","About 9.6 million"],"explanation":"In 1946 a record 649,270 baths were taken; bathhouse visitation decreased after 1946.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0051","category":"History","difficulty":"medium","era":"modern","question":"On what date did Hot Springs' Majestic Hotel catch fire?","answer":"Feb. 27, 2014","wrong":["Sept. 5, 1913","April 5, 1923","Feb. 25, 1905"],"explanation":"The Encyclopedia of Arkansas says the downtown landmark caught fire on Feb. 27, 2014.","source":"Encyclopedia of Arkansas: Hot Springs (city)","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-887/","confidence":"confirmed"},{"id":"hs-0052","category":"History","difficulty":"medium","era":"modern","question":"About how much is the Maurice Bathhouse restoration that broke ground in August 2025?","answer":"About $31.6 million","wrong":["About $3.16 million","About $316 million","About $1 million"],"explanation":"NPS celebrated the groundbreaking on Aug. 19, 2025; the Maurice is the last Bathhouse Row building to undergo rehabilitation.","source":"NPS: Groundbreaking celebrated for Maurice Bathhouse rehabilitation","sourceUrl":"https://www.nps.gov/hosp/learn/news/maurice-gaoa-groundbreaking.htm","confidence":"confirmed"},{"id":"hs-0053","category":"History","difficulty":"easy","era":"modern","question":"Which national park appeared on the first quarter in the America the Beautiful series, released in 2010?","answer":"Hot Springs National Park","wrong":["Yellowstone","Yosemite","Grand Canyon"],"explanation":"The Hot Springs quarter was released April 19, 2010.","source":"Encyclopedia of Arkansas: Hot Springs National Park","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-national-park-2547/","confidence":"confirmed"},{"id":"hs-0054","category":"History","difficulty":"medium","era":"modern","question":"What was the population of the city of Hot Springs in the 2020 census?","answer":"37,930","wrong":["3,793","79,300","100,180"],"explanation":"The Encyclopedia of Arkansas lists the city's 2020 Census population as 37,930.","source":"Encyclopedia of Arkansas: Hot Springs (city)","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-887/","confidence":"confirmed"},{"id":"hs-0055","category":"History","difficulty":"medium","era":"modern","question":"Which institute was established in 2009 at the facility that began as Hot Springs' Army and Navy hospital?","answer":"Arkansas Career Training Institute","wrong":["Hot Springs Rehabilitation Center","National Park Medical Center","Levi Hospital"],"explanation":"In 1960 the hospital was turned over to the state and became the Hot Springs Rehabilitation Center.","source":"UALR Public Radio: EOA Minute, Army-Navy Hospital","sourceUrl":"https://www.ualrpublicradio.org/2023-06-12/encyclopedia-of-arkansas-minute-army-navy-hospital","confidence":"confirmed"},{"id":"hs-0056","category":"History","difficulty":"medium","era":"any","question":"How many known archeological sites does Hot Springs National Park contain?","answer":"92","wrong":["9","47","920"],"explanation":"NPS describes a dense, rich archeological record with 92 sites and counting.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0057","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"Whose life-size statue stands in the men's bath hall of the Fordyce Bathhouse?","answer":"Hernando de Soto","wrong":["Ponce de Leon","Andrew Jackson","Thomas Jefferson"],"explanation":"The entry describes a life-sized de Soto statue in the men's bath hall; most historians discredit the de Soto legend.","source":"Encyclopedia of Arkansas: Bathhouse Row","sourceUrl":"https://encyclopediaofarkansas.net/entries/bathhouse-row-437/","confidence":"confirmed"},{"id":"hs-0058","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"In what year did the first Arlington Hotel open in Hot Springs?","answer":"1875","wrong":["1832","1893","1924"],"explanation":"The Arlington's history page says the original hotel opened in 1875 as the state's largest hotel.","source":"Arlington Hotel: History","sourceUrl":"https://www.arlingtonhotel.com/history/","confidence":"confirmed"},{"id":"hs-0059","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"What was Hot Springs' Majestic Hotel originally called when built in 1882?","answer":"The Avenue Hotel","wrong":["The Eastman Hotel","The Park Hotel","The Grand Central Hotel"],"explanation":"The Avenue Hotel was renamed the Majestic in 1888.","source":"Encyclopedia of Arkansas: Central Avenue Historic District","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-central-avenue-historic-district-7954/","confidence":"confirmed"},{"id":"hs-0060","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"What was Hot Springs' Central Avenue originally called before it was named Central Avenue by the late 1870s?","answer":"Valley Street","wrong":["Hot Water Street","Spring Row","Bathhouse Avenue"],"explanation":"The street, originally Valley Street, was named Central Avenue by the late 1870s to reflect its status as the commercial center.","source":"Encyclopedia of Arkansas: Central Avenue Historic District","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-central-avenue-historic-district-7954/","confidence":"confirmed"},{"id":"hs-0061","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"Which is the oldest surviving bathhouse on Hot Springs' Bathhouse Row?","answer":"The Hale","wrong":["The Buckstaff","The Lamar","The Fordyce"],"explanation":"EoA calls the Hale, built in 1892-93, the oldest surviving bathhouse; the Buckstaff (1912), Fordyce (1914-15) and Lamar (1923) came later.","source":"Encyclopedia of Arkansas: Bathhouse Row","sourceUrl":"https://encyclopediaofarkansas.net/entries/bathhouse-row-437/","confidence":"confirmed"},{"id":"hs-0062","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"Which Bathhouse Row bathhouse has offered baths continuously since 1912?","answer":"The Buckstaff","wrong":["The Fordyce","The Quapaw","The Maurice"],"explanation":"NPS says the Buckstaff opened on February 1, 1912, and has been in continuous operation since.","source":"NPS: Buckstaff Bathhouse","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/buckstaff-bathhouse.htm","confidence":"confirmed"},{"id":"hs-0063","category":"Places & Landmarks","difficulty":"medium","era":"gilded-spa","question":"Which 1904 Hot Springs bathhouse was the first built exclusively for African Americans?","answer":"The Crystal Bathhouse","wrong":["The Pythian Bathhouse","The Magnesia Bathhouse","The Ozark Bathhouse"],"explanation":"It stood at 415 Malvern Ave. and burned in the 1913 fire.","source":"NPS: African Americans and the Hot Springs Baths","sourceUrl":"https://www.nps.gov/articles/000/african-americans-and-the-hot-springs-baths.htm","confidence":"confirmed"},{"id":"hs-0064","category":"Places & Landmarks","difficulty":"hard","era":"gilded-spa","question":"What did the Fordyce Bathhouse cost to build in 1914–15, including fixtures?","answer":"$212,749.55","wrong":["$21,274.95","$2,127,495.50","$1.6 million"],"explanation":"The Fordyce was the most elaborate and most expensive of the bathhouses, the cost including fixtures and furniture.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0065","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"Which fountain sits beneath the Fordyce Bathhouse's stained-glass skylight?","answer":"The DeSoto Fountain","wrong":["The Noble Fountain","The Maurice Spring fountain","The Hemicycle Fountain"],"explanation":"The massive stained-glass skylight is in the men's area, with the DeSoto fountain centered on the floor directly below it.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0066","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"What color are the tile medallions on the Superior Bathhouse facade?","answer":"Green","wrong":["Red","Blue","Gold"],"explanation":"Concrete on the facade is painted to imitate ornamental tile.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0067","category":"Places & Landmarks","difficulty":"medium","era":"gilded-spa","question":"What is the name of the Maurice Bathhouse den with an inglenook fireplace?","answer":"The Roycroft (Dutch) Den","wrong":["The Neptune Room","The Electric Cave","The Monte Carlo Room"],"explanation":"The dark-panelled den has an inglenook fireplace with flanking benches and carved mascarons on the ends of the ceiling beams.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0068","category":"Places & Landmarks","difficulty":"hard","era":"gilded-spa","question":"Which two older bathhouses stood on the site of the 1922 Quapaw Bathhouse?","answer":"Horseshoe and Magnesia","wrong":["Crystal and Pythian","Lamar and Ozark","Maurice and Hale"],"explanation":"The Quapaw was built on the sites of two earlier bathhouses, the Horseshoe and the Magnesia.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0069","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"What color is the brick of the Buckstaff Bathhouse?","answer":"Cream","wrong":["Red","Yellow","Black"],"explanation":"Cream brick with white stucco trim and brass \"Buckstaff Baths\" letters.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0070","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"What bronze figures guard Bathhouse Row's 1890s main entrance?","answer":"Two federal eagles","wrong":["Two lions","Two bears","Two swans"],"explanation":"Army engineer Lt. Robert Stevens designed the reservation's entrances, including the historic main entrance.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0071","category":"Places & Landmarks","difficulty":"medium","era":"gilded-spa","question":"What was the steel observation tower that preceded today's Hot Springs Mountain Tower called?","answer":"The Rix Tower","wrong":["The Woolman Tower","The Fordyce Tower","The Arlington Tower"],"explanation":"The steel Rix Tower, opened in 1906, had an elevator to carry visitors to the top.","source":"NPS: Hot Springs Mountain Tower","sourceUrl":"https://www.nps.gov/places/hot-springs-mountain-tower.htm","confidence":"confirmed"},{"id":"hs-0072","category":"Places & Landmarks","difficulty":"medium","era":"gilded-spa","question":"About how many rooms did Hot Springs' Eastman Hotel have?","answer":"About 500","wrong":["About 50","About 150","About 5,000"],"explanation":"The Baseball Trail calls it 'the elegant, 500-room Eastman Hotel.'","source":"Hot Springs Historic Baseball Trail: The Eastman Hotel","sourceUrl":"https://hotspringsbaseballtrail.com/see-the-trail/the-eastman-hotel/","confidence":"confirmed"},{"id":"hs-0073","category":"Places & Landmarks","difficulty":"easy","era":"gilded-spa","question":"In what year was the Ohio Club on Hot Springs' Central Avenue founded?","answer":"1905","wrong":["1875","1924","1960"],"explanation":"During Prohibition the Ohio Club officially became the Ohio Cigar Store, a front with a fake wall.","source":"Encyclopedia of Arkansas: Ohio Club","sourceUrl":"https://encyclopediaofarkansas.net/entries/ohio-club-9408/","confidence":"confirmed"},{"id":"hs-0074","category":"Places & Landmarks","difficulty":"medium","era":"gilded-spa","question":"In what year was Hot Springs' Southern Club built as a private club?","answer":"1893","wrong":["1835","1913","1960"],"explanation":"Charles Dugan and Dan Stuart built it.","source":"Encyclopedia of Arkansas: Southern Club","sourceUrl":"https://encyclopediaofarkansas.net/entries/southern-club-1208/","confidence":"confirmed"},{"id":"hs-0075","category":"Places & Landmarks","difficulty":"hard","era":"gilded-spa","question":"Which Bathhouse Row bathhouse has \"spring number 46\" in a glazed-tile basement room?","answer":"The Fordyce","wrong":["The Quapaw","The Hale","The Maurice"],"explanation":"Its basement has a glazed-tile room with an arched ceiling over the natural hot spring; the Hale and Quapaw basements also show springs.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0076","category":"Places & Landmarks","difficulty":"hard","era":"roaring","question":"In which year was the current (third) Arlington Hotel completed after the 1923 fire?","answer":"1924","wrong":["1893","1923","1931"],"explanation":"Per the Arlington's history page, construction on the third Arlington began Oct. 25, 1923, and the new hotel was completed Nov. 28, 1924.","source":"Arlington Hotel: History","sourceUrl":"https://www.arlingtonhotel.com/history/","confidence":"confirmed"},{"id":"hs-0077","category":"Places & Landmarks","difficulty":"easy","era":"roaring","question":"Which bathhouse's 1923 opening completed Hot Springs' Bathhouse Row?","answer":"The Lamar","wrong":["The Hale","The Maurice","The Superior"],"explanation":"NPS: the final metamorphosis of Bathhouse Row was completed when the Lamar opened in 1923; it closed in 1985.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0078","category":"Places & Landmarks","difficulty":"medium","era":"roaring","question":"Why was Hot Springs' Quapaw Bathhouse given its name?","answer":"Native artifacts turned up while digging its basement","wrong":["A Quapaw chief once owned the site","The 1818 Quapaw treaty was signed there","A Quapaw-run company built it"],"explanation":"The entry says the Quapaw got its name from Indian artifacts found while excavating its basement.","source":"Encyclopedia of Arkansas: Bathhouse Row","sourceUrl":"https://encyclopediaofarkansas.net/entries/bathhouse-row-437/","confidence":"confirmed"},{"id":"hs-0079","category":"Places & Landmarks","difficulty":"medium","era":"roaring","question":"What inspired the Maurice Bathhouse's 1931 therapeutic pool?","answer":"FDR's treatments at Warm Springs, Ga.","wrong":["Babe Ruth's injury rehab","A Roman bath at Pompeii","The 1904 World's Fair"],"explanation":"The entry says the addition was meant to treat various forms of paralysis.","source":"Encyclopedia of Arkansas: Bathhouse Row","sourceUrl":"https://encyclopediaofarkansas.net/entries/bathhouse-row-437/","confidence":"confirmed"},{"id":"hs-0080","category":"Places & Landmarks","difficulty":"easy","era":"roaring","question":"In what architectural style was the Hale Bathhouse facade remodeled in 1939–40?","answer":"Mission","wrong":["Art Deco","Gothic Revival","Craftsman"],"explanation":"Thompson, Sanders & Ginocchio's late-1930s remodel changed the facade from neo-Classical revival to Mission Style in 1939-40.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0081","category":"Places & Landmarks","difficulty":"medium","era":"roaring","question":"What was the Maurice Bathhouse's 1931 therapeutic pool built for?","answer":"Therapy for paralysis patients","wrong":["Swimming lessons for tourists","Training spring-training ballplayers","Cooling bathwater for the Row"],"explanation":"The pool was installed in 1931 to treat paralysis; the Maurice was the only bathhouse to employ a registered physical therapist.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0082","category":"Places & Landmarks","difficulty":"easy","era":"roaring","question":"Which Bathhouse Row bathhouse is crowned by a large tiled dome?","answer":"The Quapaw","wrong":["The Buckstaff","The Lamar","The Superior"],"explanation":"Its chevron-mosaic dome is topped by a small copper cupola.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0083","category":"Places & Landmarks","difficulty":"medium","era":"roaring","question":"What was Hot Springs' Quapaw Bathhouse originally going to be named?","answer":"The Platt Bathhouse","wrong":["The Horseshoe Bathhouse","The Magnolia Bathhouse","The Rector Bathhouse"],"explanation":"After a tufa cavity turned up during excavation, the owners promoted it as an Indian cave and chose the name Quapaw instead of Platt.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0084","category":"Places & Landmarks","difficulty":"medium","era":"roaring","question":"Which fish decorates the parapets of Hot Springs' Quapaw Bathhouse?","answer":"Sculpin","wrong":["Bass","Trout","Catfish"],"explanation":"Scalloped shells frame the sculpin, originally gold and now white.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0085","category":"Places & Landmarks","difficulty":"easy","era":"roaring","question":"Which Bathhouse Row bathhouse has twin towers with three-tiered setbacks?","answer":"The Ozark","wrong":["The Buckstaff","The Lamar","The Superior"],"explanation":"The 1922 Spanish Colonial Revival design has a vague Art Deco look.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0086","category":"Places & Landmarks","difficulty":"easy","era":"roaring","question":"In what decade did construction begin on the Grand Promenade behind Bathhouse Row?","answer":"The 1930s","wrong":["The 1880s","The 1960s","The 1990s"],"explanation":"Work began in the 1930s on the promenade behind the bathhouses, which was finally completed in the early 1960s.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0087","category":"Places & Landmarks","difficulty":"medium","era":"roaring","question":"In what year was the NPS Administration Building on Bathhouse Row built?","answer":"1936","wrong":["1892","1921","1962"],"explanation":"The Spanish Colonial Revival building was designed by NPS architects and still serves as the park's administrative core.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0088","category":"Places & Landmarks","difficulty":"medium","era":"roaring","question":"After buying the Southern Club building in 1927, what material did William Jacobs use to encase its front, helping hide the gambling?","answer":"Dark Pittsburgh glass","wrong":["Stained glass","Red brick","Neon tubing"],"explanation":"Capone reportedly played poker there at an elevated table.","source":"Encyclopedia of Arkansas: Southern Club","sourceUrl":"https://encyclopediaofarkansas.net/entries/southern-club-1208/","confidence":"confirmed"},{"id":"hs-0089","category":"Places & Landmarks","difficulty":"easy","era":"midcentury","question":"Which was the first Bathhouse Row bathhouse to close, in 1962?","answer":"The Fordyce","wrong":["The Buckstaff","The Superior","The Ozark"],"explanation":"NPS: the Fordyce was the first to close, in 1962, and was later adapted for use as a visitor center and museum.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0090","category":"Places & Landmarks","difficulty":"medium","era":"midcentury","question":"What was built on the site of Hot Springs' demolished Eastman Hotel?","answer":"The federal courthouse and post office","wrong":["The Medical Arts Building","The convention center","Majestic Park"],"explanation":"Wikipedia: the Federal Building at 100 Reserve St. was built in 1959-60 on the site of the Eastman Hotel.","source":"Wikipedia: Federal Building-U.S. Post Office and Court House (Hot Springs, Arkansas)","sourceUrl":"https://en.wikipedia.org/wiki/Federal_Building%E2%80%93U.S._Post_Office_and_Court_House_(Hot_Springs,_Arkansas)","confidence":"confirmed"},{"id":"hs-0091","category":"Places & Landmarks","difficulty":"hard","era":"midcentury","question":"In what year was the Noble Fountain moved to the Reserve Avenue end of the Grand Promenade?","answer":"1957","wrong":["1903","1936","1983"],"explanation":"The Maurice Spring fountain dates from 1903 and the Administration Building fountain from 1936.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0092","category":"Places & Landmarks","difficulty":"hard","era":"midcentury","question":"When was the jug fountain in front of the NPS Administration Building in Hot Springs installed?","answer":"1966","wrong":["1832","1903","1936"],"explanation":"A new jug fountain on the sidewalk in front of the Administration building was installed in 1966.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0093","category":"Places & Landmarks","difficulty":"easy","era":"revival","question":"Which Bathhouse Row building houses Hot Springs National Park's visitor center and museum?","answer":"The Fordyce","wrong":["The Superior","The Ozark","The Hale"],"explanation":"The Fordyce reopened as the visitor center on May 13, 1989.","source":"Encyclopedia of Arkansas: Hot Springs National Park","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-national-park-2547/","confidence":"confirmed"},{"id":"hs-0094","category":"Places & Landmarks","difficulty":"easy","era":"revival","question":"How tall is the Hot Springs Mountain Tower?","answer":"216 feet","wrong":["65 feet","120 feet","573 feet"],"explanation":"The lattice steel observation tower was officially opened to the public on June 3, 1983.","source":"Wikipedia: Hot Springs Mountain Tower","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_Mountain_Tower","confidence":"confirmed"},{"id":"hs-0095","category":"Places & Landmarks","difficulty":"easy","era":"revival","question":"Which gated community near Hot Springs did John A. Cooper Sr. open in 1970?","answer":"Hot Springs Village","wrong":["Lake Hamilton Estates","Mountain Pine","Jessieville"],"explanation":"It opened June 1, 1970, on about 20,000 acres bought from Dierks Forests.","source":"Encyclopedia of Arkansas: Hot Springs Village","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-village-garland-and-saline-counties-888/","confidence":"confirmed"},{"id":"hs-0096","category":"Places & Landmarks","difficulty":"easy","era":"revival","question":"In what year did the Fordyce Bathhouse reopen as Hot Springs National Park's visitor center?","answer":"1989","wrong":["1962","1974","2008"],"explanation":"The Fordyce closed June 29, 1962, and has served as the park visitor center since 1989.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0097","category":"Places & Landmarks","difficulty":"medium","era":"revival","question":"In what month and year did the Lamar Bathhouse stop offering baths?","answer":"November 1985","wrong":["June 1962","July 2008","May 2019"],"explanation":"The Lamar's baths ended in November 1985, leaving the Buckstaff as the only bathhouse still operating on the Row until the Quapaw reopened in 2008.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0098","category":"Places & Landmarks","difficulty":"medium","era":"revival","question":"In what year was Bathhouse Row designated a National Historic Landmark District?","answer":"1987","wrong":["1832","1921","1974"],"explanation":"It was listed on the National Register in 1974 and became an NHL district May 28, 1987.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0099","category":"Places & Landmarks","difficulty":"medium","era":"revival","question":"In what month and year did the current Hot Springs Mountain Tower open?","answer":"June 1983","wrong":["June 1904","June 1924","June 2003"],"explanation":"Construction began in 1982; it opened June 3, 1983.","source":"Wikipedia: Hot Springs Mountain Tower","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_Mountain_Tower","confidence":"confirmed"},{"id":"hs-0100","category":"Places & Landmarks","difficulty":"hard","era":"revival","question":"On what date was Hot Springs' Bathhouse Row listed on the National Register of Historic Places?","answer":"Nov. 13, 1974","wrong":["April 20, 1832","March 4, 1921","Oct. 15, 1966"],"explanation":"NPS: Bathhouse Row and its environs were placed on the National Register of Historic Places on Nov. 13, 1974.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0101","category":"Places & Landmarks","difficulty":"easy","era":"modern","question":"Which Bathhouse Row bathhouse is now the nine-suite Hotel Hale?","answer":"The Hale","wrong":["The Lamar","The Ozark","The Maurice"],"explanation":"NPS says the Hale Bathhouse is now Hotel Hale, with 9 suites whose soaking tubs get hot springs mineral water.","source":"NPS: Hale Bathhouse","sourceUrl":"https://www.nps.gov/places/hale-bathhouse.htm","confidence":"confirmed"},{"id":"hs-0102","category":"Places & Landmarks","difficulty":"easy","era":"modern","question":"Which Bathhouse Row bathhouse now houses a brewery and distillery?","answer":"The Superior","wrong":["The Ozark","The Lamar","The Quapaw"],"explanation":"The Superior Bathhouse Brewery and Distillery has occupied the Superior Bathhouse since 2012.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas","confidence":"confirmed"},{"id":"hs-0103","category":"Places & Landmarks","difficulty":"medium","era":"modern","question":"When did Quapaw Baths & Spa open in the restored Quapaw Bathhouse?","answer":"July 2008","wrong":["July 1922","May 1989","May 2019"],"explanation":"NPS restored the building in 2004.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0104","category":"Places & Landmarks","difficulty":"easy","era":"modern","question":"What does the Ozark Bathhouse on Bathhouse Row house today?","answer":"Hot Springs NP Cultural Center","wrong":["The park visitor center","A brewery and distillery","A nine-room hotel"],"explanation":"It reopened in 2014 as a cultural center showing artist-in-residence work.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0105","category":"Places & Landmarks","difficulty":"easy","era":"modern","question":"Which Bathhouse Row building holds the official park store, the Bathhouse Row Emporium?","answer":"The Lamar","wrong":["The Hale","The Superior","The Maurice"],"explanation":"The Lamar also served as interim visitor center while the Fordyce was renovated.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0106","category":"Places & Landmarks","difficulty":"easy","era":"modern","question":"What color was the brick of the Majestic Hotel section destroyed by fire in 2014?","answer":"Yellow","wrong":["Red","Cream","Black"],"explanation":"The rest of the condemned hotel was razed in late 2016.","source":"Encyclopedia of Arkansas: Majestic Hotel","sourceUrl":"https://encyclopediaofarkansas.net/entries/majestic-hotel-8351/","confidence":"confirmed"},{"id":"hs-0107","category":"Places & Landmarks","difficulty":"easy","era":"modern","question":"What museum now occupies Hot Springs' former Southern Club casino?","answer":"Josephine Tussaud Wax Museum","wrong":["Gangster Museum of America","Mid-America Science Museum","Fordyce Bathhouse Museum"],"explanation":"The club stood at 250 Central Avenue.","source":"Encyclopedia of Arkansas: Southern Club","sourceUrl":"https://encyclopediaofarkansas.net/entries/southern-club-1208/","confidence":"confirmed"},{"id":"hs-0108","category":"Places & Landmarks","difficulty":"easy","era":"modern","question":"Which 2006 wood-and-glass chapel stands in Garvan Woodland Gardens?","answer":"Anthony Chapel","wrong":["Thorncrown Chapel","Visitors Chapel","Park Place Chapel"],"explanation":"Designed by architects Maurice Jennings and David McKee of Fayetteville; it officially opened in September 2006.","source":"Encyclopedia of Arkansas: Garvan Woodland Gardens","sourceUrl":"https://encyclopediaofarkansas.net/entries/garvan-woodland-gardens-4197","confidence":"confirmed"},{"id":"hs-0109","category":"Places & Landmarks","difficulty":"easy","era":"any","question":"How many historic bathhouses stand on Hot Springs' Bathhouse Row?","answer":"Eight","wrong":["Six","Twelve","Forty-seven"],"explanation":"Superior, Hale, Maurice, Fordyce, Quapaw, Ozark, Buckstaff and Lamar line Central Avenue.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0110","category":"Places & Landmarks","difficulty":"medium","era":"any","question":"What is the street address of the Buckstaff Bathhouse?","answer":"509 Central Avenue","wrong":["239 Central Avenue","336 Central Avenue","1011 Park Avenue"],"explanation":"NPS lists the Buckstaff at 509 Central and the Quapaw at 413 Central.","source":"NPS: Soak in the ter-dunbar-expedition-2205/","confidence":"confirmed"},{"id":"hs-0115","category":"Nature & Lakes","difficulty":"hard","era":"frontier","question":"What did the Dunbar–Hunter party call the creek, now Gulpha Creek, where it camped in December 1804?","answer":"Calfait Creek","wrong":["Fourche a Loupe","Hot Springs Creek","Ellis Bayou"],"explanation":"They camped at the confluence of Calfait Creek (today Gulpha Creek), also called Ellis Landing.","source":"Encyclopedia of Arkansas: Hunter-Dunbar Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/hunter-dunbar-expedition-2205/","confidence":"confirmed"},{"id":"hs-0116","category":"Nature & Lakes","difficulty":"hard","era":"gilded-spa","question":"In what year was Yale's Bertram Boltwood authorized to study the radioactivity of the Hot Springs waters?","answer":"1904","wrong":["1804","1832","1946"],"explanation":"He concluded the radioactivity came from dissolved radium emanation, a gas, not from radium salts.","source":"NPS 1920 brochure","sourceUrl":"https://npshistory.com/publications/hosp/brochures/1920/sec1.htm","confidence":"confirmed"},{"id":"hs-0117","category":"Nature & Lakes","difficulty":"easy","era":"gilded-spa","question":"Which creek flows through a tunnel beneath Hot Springs' Bathhouse Row?","answer":"Hot Springs Creek","wrong":["Gulpha Creek","Fourche a Loupe","Alum Fork"],"explanation":"The government enclosed the creek in an underground arch in 1882-83 for flood and sewerage control.","source":"NPS: Bathhouse Row","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/bathhouse-row.htm","confidence":"confirmed"},{"id":"hs-0118","category":"Nature & Lakes","difficulty":"easy","era":"gilded-spa","question":"What was the Ouachita National Forest called when it was established in 1907?","answer":"Arkansas National Forest","wrong":["Ozark National Forest","Hot Springs Forest Reserve","Quapaw National Forest"],"explanation":"It was renamed on April 29, 1926.","source":"Wikipedia: Ouachit https://en.wikipedia.org/wiki/Lake_Ouachita","confidence":"confirmed"},{"id":"hs-0127","category":"Nature & Lakes","difficulty":"easy","era":"midcentury","question":"About how many islands does Lake Ouachita have?","answer":"About 200","wrong":["About 20","About 12","About 2,000"],"explanation":"Wikipedia's infobox lists 200 islands for the lake.","source":"Wikipedia: Lake Ouachita","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Ouachita","confidence":"confirmed"},{"id":"hs-0128","category":"Nature & Lakes","difficulty":"medium","era":"midcentury","question":"Which historic healing springs does Lake Ouachita State Park preserve?","answer":"Three Sisters Springs","wrong":["Happy Hollow Springs","Ral Spring","Display Spring"],"explanation":"The 360-acre park opened in 1955.","source":"Wikipedia: Lake Ouachita State Park","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Ouachita_State_Park","confidence":"confirmed"},{"id":"hs-0129","category":"Nature & Lakes","difficulty":"medium","era":"midcentury","question":"In what year did quartz crystal become Arkansas's state mineral?","answer":"1967","wrong":["1836","1921","2004"],"explanation":"EoA says Gov. Winthrop Rockefeller signed Act 128 on Feb. 22, 1967, naming quartz crystal the state mineral.","source":"Encyclopedia of Arkansas: Official State Mineral","sourceUrl":"https://encyclopediaofarkansas.net/entries/official-state-mineral-3138/","confidence":"confirmed"},{"id":"hs-0130","category":"Nature & Lakes","difficulty":"medium","era":"revival","question":"On which river is DeGray Lake, south of Hot Springs?","answer":"The Caddo River","wrong":["The Ouachita River","The Saline River","The Arkansas River"],"explanation":"The dam is approximately eight miles above the river's confluence with the Ouachita River.","source":"Wikipedia: DeGray Lake","sourceUrl":"https://en.wikipedia.org/wiki/DeGray_Lake","confidence":"confirmed"},{"id":"hs-0131","category":"Nature & Lakes","difficulty":"medium","era":"revival","question":"According to Wikipedia, DeGray Lake holds the distinction as the first Corps of Engineers impoundment able to do what?","answer":"Pump water back","wrong":["Cool a nuclear plant","Store salt water","Float a marina town"],"explanation":"Wikipedia calls it the first \"pump back capable\" impoundment in the history of the Corps of Engineers.","source":"Wikipedia: DeGray Lake","sourceUrl":"https://en.wikipedia.org/wiki/DeGray_Lake","confidence":"claim"},{"id":"hs-0132","category":"Nature & Lakes","difficulty":"medium","era":"revival","question":"What is DeGray Lake's maximum depth?","answer":"About 200 ft","wrong":["About 20 ft","About 47 ft","About 600 ft"],"explanation":"Its average depth is about 47 ft.","source":"Wikipedia: DeGray Lake","sourceUrl":"https://en.wikipedia.org/wiki/DeGray_Lake","confidence":"confirmed"},{"id":"hs-0133","category":"Nature & Lakes","difficulty":"medium","era":"revival","question":"What is the largest lake in Hot Springs Village?","answer":"Lake Balboa","wrong":["Lake Coronado","Lake DeSoto","Lake Cortez"],"explanation":"The Hot Springs Village site lists Lake Balboa at 944 acres.","source":"Explore the Village (Hot Springs Village): Lakes","sourceUrl":"https://explorethevillage.com/web/pages/lakes","confidence":"confirmed"},{"id":"hs-0134","category":"Nature & Lakes","difficulty":"hard","era":"revival","question":"What is the Arkansas state-record walleye, and where was it caught?","answer":"22 lb 11 oz, Greers Ferry Lake","wrong":["64 lb 8 oz, Beaver Lake","16 lb 4 oz, Mallard Lake","27 lb 5 oz, Lake Ouachita"],"explanation":"Al Nelson caught it on March 12, 1982.","source":"AGFC: State records","sourceUrl":"https://agfc.com/?p=1958","confidence":"confirmed"},{"id":"hs-0135","category":"Nature & Lakes","difficulty":"medium","era":"modern","question":"What is Arkansas's statewide daily limit for black bass?","answer":"10, no more than 4 smallmouth","wrong":["5, no more than 1 smallmouth","30, no smallmouth","2, both largemouth"],"explanation":"The possession limit is triple the daily limit.","source":"AGFC: Statewide lengths and daily limits","sourceUrl":"https://www.agfc.com/education/statewide-lengths-and-daily-limits/","confidence":"confirmed"},{"id":"hs-0136","category":"Nature & Lakes","difficulty":"easy","era":"modern","question":"What is Arkansas's statewide daily crappie limit?","answer":"30","wrong":["5","10","100"],"explanation":"Black and white crappie are combined in the limit; area-specific rules may differ.","source":"AGFC: Statewide lengths and daily limits","sourceUrl":"https://www.agfc.com/education/statewide-lengths-and-daily-limits/","confidence":"confirmed"},{"id":"hs-0137","category":"Nature & Lakes","difficulty":"hard","era":"modern","question":"What is the Arkansas state-record striped bass?","answer":"64 lb 8 oz","wrong":["16 lb 4 oz","22 lb 11 oz","41 lb 8 oz"],"explanation":"AGFC lists it as caught at Beaver Lake Tailwater on 04/28/2000.","source":"AGFC: State records","sourceUrl":"https://agfc.com/?p=1958","confidence":"confirmed"},{"id":"hs-0138","category":"Nature & Lakes","difficulty":"easy","era":"modern","question":"Why must Lake Ouachita's striped bass be stocked every year?","answer":"They don't reproduce naturally there","wrong":["They die every summer","Anglers keep them all","Weeds smother the young"],"explanation":"AGFC says striped bass do not reproduce naturally in the wild, apart from one Arkansas River population; Lake Ouachita is one of four lakes it stocks.","source":"Arkansas Game & Fish Commission: Striped Bass","sourceUrl":"https://www.agfc.com/fishing/more-species/striped-bass/","confidence":"confirmed"},{"id":"hs-0139","category":"Nature & Lakes","difficulty":"easy","era":"modern","question":"What tree did AGFC and the Corps mostly use for new Lake Ouachita fish brush piles?","answer":"Cedar","wrong":["Pine","Oak","Hickory"],"explanation":"AGFC said the brush piles would sit in the 20- to 25-foot range most of the year, on points near the mid-lake islands.","source":"AGFC: Improving angling odds at Lake Ouachita","sourceUrl":"https://www.agfc.com/news/agfc-uscoe-improve-angling-odds-at-lake-ouachita/","confidence":"confirmed"},{"id":"hs-0140","category":"Nature & Lakes","difficulty":"hard","era":"modern","question":"What lure caught the 11-lb Lake Hamilton largemouth at a May 2024 club tournament?","answer":"Texas-rigged Zoom Speed Craw","wrong":["Topwater frog","Live minnow under a bobber","Spinnerbait"],"explanation":"The color was Green Pumpkin Magic.","source":"AGFC: Tourney anglers catch a couple of whopper bass in Lake Hamilton","sourceUrl":"https://agfc.com/?p=14959","confidence":"confirmed"},{"id":"hs-0141","category":"Nature & Lakes","difficulty":"easy","era":"modern","question":"How many acres is Garvan Woodland Gardens on Lake Hamilton?","answer":"210","wrong":["21","2,100","5,839"],"explanation":"The University of Arkansas owns the garden.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens","confidence":"confirmed"},{"id":"hs-0142","category":"Nature & Lakes","difficulty":"hard","era":"modern","question":"How many miles of trail make up Phase One of Hot Springs' Northwoods trail system, which began opening in 2018?","answer":"14","wrong":["4","44","140"],"explanation":"Seven of Phase I's 14 miles opened Nov. 17, 2018; the finished system is described as about 44 miles.","source":"Singletracks: Northwoods Trails","sourceUrl":"https://www.singletracks.com/mtb-trails/northwoods-trails-system/","confidence":"confirmed"},{"id":"hs-0143","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"What does the name of novaculite, the Ouachita whetstone rock, mean in Latin?","answer":"Razor stone","wrong":["Thunder stone","White bone","River glass"],"explanation":"Novaculite takes its name from the Latin for \"razor stone.\"","source":"Encyclopedia of Arkansas: Novaculite","sourceUrl":"https://encyclopediaofarkansas.net/entries/novaculite-2220/","confidence":"confirmed"},{"id":"hs-0144","category":"Nature & Lakes","difficulty":"medium","era":"any","question":"What two industry grades are Garland County novaculite whetstones sold as?","answer":"Washita and Arkansas","wrong":["Ouachita and Ozark","Hot Spring and Garland","Caddo and Quapaw"],"explanation":"\"Washita\" is duller and porous; \"Arkansas\" is finer-grained, waxy and denser.","source":"Encyclopedia of Arkansas: Novaculite","sourceUrl":"https://encyclopediaofarkansas.net/entries/novaculite-2220/","confidence":"confirmed"},{"id":"hs-0145","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"About how old is most Hot Springs thermal water, per USGS tritium and carbon-14 dating?","answer":"About 4,400 years","wrong":["About 44 years","About 440,000 years","About 4.4 million years"],"explanation":"USGS found the water is a mix: a very small amount under 20 years old and a preponderance about 4,400 years old.","source":"USGS Professional Paper 1044-C: Abstract (npshistory.com mirror)","sourceUrl":"https://npshistory.com/publications/geology/pp/1044-C/abstract.htm","confidence":"confirmed"},{"id":"hs-0146","category":"Nature & Lakes","difficulty":"medium","era":"any","question":"Per the National Park Service, about how much water do the Hot Springs thermal springs produce per day?","answer":"Over 700,000 gallons","wrong":["About 7,000 gallons","About 70 million gallons","About 7 billion gallons"],"explanation":"NPS says the springs produce over 700,000 gallons of water a day.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm","confidence":"confirmed"},{"id":"hs-0147","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"What is the average temperature of Hot Springs' thermal spring water?","answer":"About 143°F","wrong":["About 98°F","About 112°F","About 212°F"],"explanation":"NPS calls them the hottest springs east of the Rocky Mountains.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm","confidence":"confirmed"},{"id":"hs-0148","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"According to the USGS, how many hot springs emerge from Hot Springs Mountain in Hot Springs National Park?","answer":"47","wrong":["7","12","92"],"explanation":"USGS says the park is best known for its 47 hot springs, which emerge from Hot Springs Mountain at an average temperature of 143 degrees Fahrenheit.","source":"USGS: Hot Springs National Park","sourceUrl":"https://www.usgs.gov/geology-and-ecology-of-national-parks/hot-springs-national-park","confidence":"confirmed"},{"id":"hs-0149","category":"Nature & Lakes","difficulty":"hard","era":"any","question":"Which two dating methods showed most Hot Springs thermal water is about 4,400 years old?","answer":"Tritium and carbon-14","wrong":["Potassium-argon and uranium-lead","Tree rings and ice cores","Radon and radium counts"],"explanation":"USGS Professional Paper 1044-C found a small share of water under 20 years old.","source":"USGS Professional Paper 1044-C: Abstract (npshistory.com mirror)","sourceUrl":"https://npshistory.com/publications/geology/pp/1044-C/abstract.htm","confidence":"confirmed"},{"id":"hs-0150","category":"Nature & Lakes","difficulty":"hard","era":"any","question":"Outcrops of which two rock formations recharge the Hot Springs thermal springs?","answer":"Bigfork Chert and Arkansas Novaculite","wrong":["Stanley Shale and Womble Shale","Hot Springs Sandstone and granite","Limestone and marble"],"explanation":"USGS: rainfall infiltrates the outcrops, and the water moves slowly to depth where rocks heat it.","source":"USGS Professional Paper 1044-C: Abstract (npshistory.com mirror)","sourceUrl":"https://npshistory.com/publications/geology/pp/1044-C/abstract.htm","confidence":"confirmed"},{"id":"hs-0151","category":"Nature & Lakes","difficulty":"medium","era iki/Hot_Springs,_Arkansas","confidence":"confirmed"},{"id":"hs-0471","category":"Legends & Oddities","difficulty":"easy","era":"ancient","question":"What do historians conclude about the legend that Hernando de Soto bathed at Hot Springs in 1541?","answer":"There is no firm evidence he visited","wrong":["His journals prove it","Spanish coins found there prove it","The NPS confirmed it in 1921"],"explanation":"Spanish explorers passed through Garland County in 1541, but no absolute proof exists that de Soto visited the springs.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0472","category":"Legends & Oddities","difficulty":"medium","era":"ancient","question":"Which stone did Native peoples quarry in the hills around Hot Springs for thousands of years?","answer":"Novaculite","wrong":["Obsidian","Jade","Turquoise"],"explanation":"Indians quarried novaculite from bedrock deposits in the hills around Hot Springs for many thousands of years.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/Garland-County-770","confidence":"confirmed"},{"id":"hs-0473","category":"Legends & Oddities","difficulty":"easy","era":"frontier","question":"Hot Springs National Park began in 1832 as what kind of protected land?","answer":"A federal reservation","wrong":["A state park","A Quapaw treaty ground","A military fort"],"explanation":"EOA calls it the nation's first federal reservation.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/Garland-County-770","confidence":"confirmed"},{"id":"hs-0474","category":"Legends & Oddities","difficulty":"easy","era":"gilded-spa","question":"How did railroad builder Joseph \"Diamond Jo\" Reynolds get his nickname?","answer":"He marked shipments \"Jo\" inside a diamond","wrong":["He wore a huge diamond ring","He won a dia   if (m) {
    let sheet = modal.firstElementChild;
    if (!sheet) { modal.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div>'; sheet = modal.firstElementChild; last.modal = ''; }
    if (!was) { modal.hidden = false; sheet.classList.remove('enter'); void sheet.offsetWidth; sheet.classList.add('enter'); ui.modalAt = performance.now(); }
    if (write(sheet, m, 'modal') && !modal.contains(document.activeElement)) focusFirst(modal);
  } else if (was) { modal.hidden = true; last.modal = ''; modal.innerHTML = ''; if (sc === 'game') focusFirst($('#panel')); }
  document.body.classList.toggle('modal-open', !!m);
  if (ui.focusNext === 'scene') { ui.focusNext = null; const root = sc === 'game' ? (m ? modal : $('#panel')) : $('#scene-' + sc); focusFirst(root); }
  updateTopbar();
}

function focusFirst(root) {
  if (!root) return;
  const el = root.querySelector('[data-autofocus]') || root.querySelector('button:not([disabled]), input, select');
  if (el) el.focus({ preventScroll: true });
}

function updateTopbar() {
  const s = G.state.settings;
  const b = $('#btn-sound'); if (b) { b.setAttribute('aria-pressed', String(!s.sound)); b.setAttribute('aria-label', s.sound ? 'Mute sound (M)' : 'Unmute sound (M)'); b.classList.toggle('off', !s.sound); }
  const z = $('#btn-zoom'); if (z) { const v = G.view; z.textContent = v && v.mode === 'follow' ? 'Whole map' : 'Close-up'; }
}

function stampPips(p) {

}

function panelHTML() {
  const t = Game.T(); if (!t) return '';
  const p = Game.cur(); const ai = p.kind === 'ai';
  let action = '';
  const who = `<strong>${esc(p.name)}</strong>`;
  switch (t.phase) {
    case 'roll':
      action = ai ? `<p class="status">${who} is getting ready…</p>` :
        `${btn('roll', 'Roll the steam gauge', { cls: 'primary big', hint: 'Space', auto: true })}
         ${Game.canTrolley(p) ? btn('trolley-open', 'Ride the trolley · 2 tickets', { cls: 'ghost', hint: 'T' }) : ''}`;
      break;
    case 'choose': {
      const list = t.dests.map((d, i) => {
        const n = NODES[d.node]; const c = n.cat ? CAT[n.cat] : null;
        const kind = n.type === 'landmark' ? `Landmark · ${c.short}` : n.type === 'cat' ? c.short : { vent: 'Steam vent', wager: 'Post Time wager', warp: 'Time Warp', postcard: 'Postcard', jury: 'Grand Jury', trolley: 'Trolley stop', start: 'The Y · trolley', trailhead: 'Trailhead', trail: 'Mountain trail', tower: 'Mountain Tower!' }[n.type];
        const dn = n.district && DISTRICT[n.district] ? DISTRICT[n.district].name : n.district === 'mountain' ? 'Hot Springs Mountain' : 'Downtown';
        return `<li><button class="dest${i === t.sel ? ' sel' : ''}" data-act="choose" data-arg="${d.node}" data-key="dest${d.node}"${ai ? ' disabled' : ''} aria-current="${i === t.sel}">
          <span class="num" aria-hidden="true">${i + 1}</span>${c && (n.type === 'cat' || n.type === 'landmark') ? ico(c.icon, c.color, c.ink, 24) : ico(n.type === 'tower' ? 'tower' : n.type === 'trail' ? 'trailhead' : ({ start: 'star' }[n.type] || n.type), '', 'currentColor', 24)}
          <span class="dtext"><span class="dname">${esc(n.name)}</span><span class="dsub">${esc(kind)} · ${esc(dn)}</span></span></button></li>`;
      }).join('');
      action = `<p class="status">${who} rolled <span class="die" aria-label="${t.roll}">${t.roll}</span> ${ai ? 'and is choosing…' : '— pick where to stop:'}</p>

      break;
    }
    case 'moving': action = `<p class="status">${who} is on the move…</p>`; break;
    case 'skipped': action = `<p class="status">${who} sits out this turn.</p>`; break;
    case 'stuck': action = `<p class="status">No space is exactly ${t.roll} away — ${who} waits in the steam.</p>`; break;
    case 'landed': action = `<p class="status">${who} stops at ${esc(NODES[p.node].name)}.</p>`; break;
    case 'over': action = `<p class="status">${who} wins!</p>`; break;
