https://en.wikipedia.org/wiki/Lake_Ouachita","confidence":"confirmed"},{"id":"hs-0127","category":"Nature & Lakes","difficulty":"easy","era":"midcentury","question":"About how many islands does Lake Ouachita have?","answer":"About 200","wrong":["About 20","About 12","About 2,000"],"explanation":"Wikipedia's infobox lists 200 islands for the lake.","source":"Wikipedia: Lake Ouachita","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Ouachita","confidence":"confirmed"},{"id":"hs-0128","category":"Nature & Lakes","difficulty":"medium","era":"midcentury","question":"Which historic healing springs does Lake Ouachita State Park preserve?","answer":"Three Sisters Springs","wrong":["Happy Hollow Springs","Ral Spring","Display Spring"],"explanation":"The 360-acre park opened in 1955.","source":"Wikipedia: Lake Ouachita State Park","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Ouachita_State_Park","confidence":"confirmed"},{"id":"hs-0129","category":"Nature & Lakes","difficulty":"medium","era":"midcentury","question":"In what year did quartz crystal become Arkansas's state mineral?","answer":"1967","wrong":["1836","1921","2004"],"explanation":"EoA says Gov. Winthrop Rockefeller signed Act 128 on Feb. 22, 1967, naming quartz crystal the state mineral.","source":"Encyclopedia of Arkansas: Official State Mineral","sourceUrl":"https://encyclopediaofarkansas.net/entries/official-state-mineral-3138/","confidence":"confirmed"},{"id":"hs-0130","category":"Nature & Lakes","difficulty":"medium","era":"revival","question":"On which river is DeGray Lake, south of Hot Springs?","answer":"The Caddo River","wrong":["The Ouachita River","The Saline River","The Arkansas River"],"explanation":"The dam is approximately eight miles above the river's confluence with the Ouachita River.","source":"Wikipedia: DeGray Lake","sourceUrl":"https://en.wikipedia.org/wiki/DeGray_Lake","confidence":"confirmed"},{"id":"hs-0131","category":"Nature & Lakes","difficulty":"medium","era":"revival","question":"According to Wikipedia, DeGray Lake holds the distinction as the first Corps of Engineers impoundment able to do what?","answer":"Pump water back","wrong":["Cool a nuclear plant","Store salt water","Float a marina town"],"explanation":"Wikipedia calls it the first \"pump back capable\" impoundment in the history of the Corps of Engineers.","source":"Wikipedia: DeGray Lake","sourceUrl":"https://en.wikipedia.org/wiki/DeGray_Lake","confidence":"claim"},{"id":"hs-0132","category":"Nature & Lakes","difficulty":"medium","era":"revival","question":"What is DeGray Lake's maximum depth?","answer":"About 200 ft","wrong":["About 20 ft","About 47 ft","About 600 ft"],"explanation":"Its average depth is about 47 ft.","source":"Wikipedia: DeGray Lake","sourceUrl":"https://en.wikipedia.org/wiki/DeGray_Lake","confidence":"confirmed"},{"id":"hs-0133","category":"Nature & Lakes","difficulty":"medium","era":"revival","question":"What is the largest lake in Hot Springs Village?","answer":"Lake Balboa","wrong":["Lake Coronado","Lake DeSoto","Lake Cortez"],"explanation":"The Hot Springs Village site lists Lake Balboa at 944 acres.","source":"Explore the Village (Hot Springs Village): Lakes","sourceUrl":"https://explorethevillage.com/web/pages/lakes","confidence":"confirmed"},{"id":"hs-0134","category":"Nature & Lakes","difficulty":"hard","era":"revival","question":"What is the Arkansas state-record walleye, and where was it caught?","answer":"22 lb 11 oz, Greers Ferry Lake","wrong":["64 lb 8 oz, Beaver Lake","16 lb 4 oz, Mallard Lake","27 lb 5 oz, Lake Ouachita"],"explanation":"Al Nelson caught it on March 12, 1982.","source":"AGFC: State records","sourceUrl":"https://agfc.com/?p=1958","confidence":"confirmed"},{"id":"hs-0135","category":"Nature & Lakes","difficulty":"medium","era":"modern","question":"What is Arkansas's statewide daily limit for black bass?","answer":"10, no more than 4 smallmouth","wrong":["5, no more than 1 smallmouth","30, no smallmouth","2, both largemouth"],"explanation":"The possession limit is triple the daily limit.","source":"AGFC: Statewide lengths and daily limits","sourceUrl":"https://www.agfc.com/education/statewide-lengths-and-daily-limits/","confidence":"confirmed"},{"id":"hs-0136","category":"Nature & Lakes","difficulty":"easy","era":"modern","question":"What is Arkansas's statewide daily crappie limit?","answer":"30","wrong":["5","10","100"],"explanation":"Black and white crappie are combined in the limit; area-specific rules may differ.","source":"AGFC: Statewide lengths and daily limits","sourceUrl":"https://www.agfc.com/education/statewide-lengths-and-daily-limits/","confidence":"confirmed"},{"id":"hs-0137","category":"Nature & Lakes","difficulty":"hard","era":"modern","question":"What is the Arkansas state-record striped bass?","answer":"64 lb 8 oz","wrong":["16 lb 4 oz","22 lb 11 oz","41 lb 8 oz"],"explanation":"AGFC lists it as caught at Beaver Lake Tailwater on 04/28/2000.","source":"AGFC: State records","sourceUrl":"https://agfc.com/?p=1958","confidence":"confirmed"},{"id":"hs-0138","category":"Nature & Lakes","difficulty":"easy","era":"modern","question":"Why must Lake Ouachita's striped bass be stocked every year?","answer":"They don't reproduce naturally there","wrong":["They die every summer","Anglers keep them all","Weeds smother the young"],"explanation":"AGFC says striped bass do not reproduce naturally in the wild, apart from one Arkansas River population; Lake Ouachita is one of four lakes it stocks.","source":"Arkansas Game & Fish Commission: Striped Bass","sourceUrl":"https://www.agfc.com/fishing/more-species/striped-bass/","confidence":"confirmed"},{"id":"hs-0139","category":"Nature & Lakes","difficulty":"easy","era":"modern","question":"What tree did AGFC and the Corps mostly use for new Lake Ouachita fish brush piles?","answer":"Cedar","wrong":["Pine","Oak","Hickory"],"explanation":"AGFC said the brush piles would sit in the 20- to 25-foot range most of the year, on points near the mid-lake islands.","source":"AGFC: Improving angling odds at Lake Ouachita","sourceUrl":"https://www.agfc.com/news/agfc-uscoe-improve-angling-odds-at-lake-ouachita/","confidence":"confirmed"},{"id":"hs-0140","category":"Nature & Lakes","difficulty":"hard","era":"modern","question":"What lure caught the 11-lb Lake Hamilton largemouth at a May 2024 club tournament?","answer":"Texas-rigged Zoom Speed Craw","wrong":["Topwater frog","Live minnow under a bobber","Spinnerbait"],"explanation":"The color was Green Pumpkin Magic.","source":"AGFC: Tourney anglers catch a couple of whopper bass in Lake Hamilton","sourceUrl":"https://agfc.com/?p=14959","confidence":"confirmed"},{"id":"hs-0141","category":"Nature & Lakes","difficulty":"easy","era":"modern","question":"How many acres is Garvan Woodland Gardens on Lake Hamilton?","answer":"210","wrong":["21","2,100","5,839"],"explanation":"The University of Arkansas owns the garden.","source":"Wikipedia: Garvan Woodland Gardens","sourceUrl":"https://en.wikipedia.org/wiki/Garvan_Woodland_Gardens","confidence":"confirmed"},{"id":"hs-0142","category":"Nature & Lakes","difficulty":"hard","era":"modern","question":"How many miles of trail make up Phase One of Hot Springs' Northwoods trail system, which began opening in 2018?","answer":"14","wrong":["4","44","140"],"explanation":"Seven of Phase I's 14 miles opened Nov. 17, 2018; the finished system is described as about 44 miles.","source":"Singletracks: Northwoods Trails","sourceUrl":"https://www.singletracks.com/mtb-trails/northwoods-trails-system/","confidence":"confirmed"},{"id":"hs-0143","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"What does the name of novaculite, the Ouachita whetstone rock, mean in Latin?","answer":"Razor stone","wrong":["Thunder stone","White bone","River glass"],"explanation":"Novaculite takes its name from the Latin for \"razor stone.\"","source":"Encyclopedia of Arkansas: Novaculite","sourceUrl":"https://encyclopediaofarkansas.net/entries/novaculite-2220/","confidence":"confirmed"},{"id":"hs-0144","category":"Nature & Lakes","difficulty":"medium","era":"any","question":"What two industry grades are Garland County novaculite whetstones sold as?","answer":"Washita and Arkansas","wrong":["Ouachita and Ozark","Hot Spring and Garland","Caddo and Quapaw"],"explanation":"\"Washita\" is duller and porous; \"Arkansas\" is finer-grained, waxy and denser.","source":"Encyclopedia of Arkansas: Novaculite","sourceUrl":"https://encyclopediaofarkansas.net/entries/novaculite-2220/","confidence":"confirmed"},{"id":"hs-0145","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"About how old is most Hot Springs thermal water, per USGS tritium and carbon-14 dating?","answer":"About 4,400 years","wrong":["About 44 years","About 440,000 years","About 4.4 million years"],"explanation":"USGS found the water is a mix: a very small amount under 20 years old and a preponderance about 4,400 years old.","source":"USGS Professional Paper 1044-C: Abstract (npshistory.com mirror)","sourceUrl":"https://npshistory.com/publications/geology/pp/1044-C/abstract.htm","confidence":"confirmed"},{"id":"hs-0146","category":"Nature & Lakes","difficulty":"medium","era":"any","question":"Per the National Park Service, about how much water do the Hot Springs thermal springs produce per day?","answer":"Over 700,000 gallons","wrong":["About 7,000 gallons","About 70 million gallons","About 7 billion gallons"],"explanation":"NPS says the springs produce over 700,000 gallons of water a day.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm","confidence":"confirmed"},{"id":"hs-0147","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"What is the average temperature of Hot Springs' thermal spring water?","answer":"About 143°F","wrong":["About 98°F","About 112°F","About 212°F"],"explanation":"NPS calls them the hottest springs east of the Rocky Mountains.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm","confidence":"confirmed"},{"id":"hs-0148","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"According to the USGS, how many hot springs emerge from Hot Springs Mountain in Hot Springs National Park?","answer":"47","wrong":["7","12","92"],"explanation":"USGS says the park is best known for its 47 hot springs, which emerge from Hot Springs Mountain at an average temperature of 143 degrees Fahrenheit.","source":"USGS: Hot Springs National Park","sourceUrl":"https://www.usgs.gov/geology-and-ecology-of-national-parks/hot-springs-national-park","confidence":"confirmed"},{"id":"hs-0149","category":"Nature & Lakes","difficulty":"hard","era":"any","question":"Which two dating methods showed most Hot Springs thermal water is about 4,400 years old?","answer":"Tritium and carbon-14","wrong":["Potassium-argon and uranium-lead","Tree rings and ice cores","Radon and radium counts"],"explanation":"USGS Professional Paper 1044-C found a small share of water under 20 years old.","source":"USGS Professional Paper 1044-C: Abstract (npshistory.com mirror)","sourceUrl":"https://npshistory.com/publications/geology/pp/1044-C/abstract.htm","confidence":"confirmed"},{"id":"hs-0150","category":"Nature & Lakes","difficulty":"hard","era":"any","question":"Outcrops of which two rock formations recharge the Hot Springs thermal springs?","answer":"Bigfork Chert and Arkansas Novaculite","wrong":["Stanley Shale and Womble Shale","Hot Springs Sandstone and granite","Limestone and marble"],"explanation":"USGS: rainfall infiltrates the outcrops, and the water moves slowly to depth where rocks heat it.","source":"USGS Professional Paper 1044-C: Abstract (npshistory.com mirror)","sourceUrl":"https://npshistory.com/publications/geology/pp/1044-C/abstract.htm","confidence":"confirmed"},{"id":"hs-0151","category":"Nature & Lakes","difficulty":"medium","era":"any","question":"What are the names of the two faults the National Park Service says help carry Hot Springs' heated water back to the surface?","answer":"Alpha and beta","wrong":["North and south","Zig and zag","One and two"],"explanation":"NPS says fault lines help direct the heated water back to the surface.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm","confidence":"confirmed"},{"id":"hs-0152","category":"Nature & Lakes","difficulty":"hard","era":"any","question":"Which downtown Hot Springs streets does the \"alpha\" fault roughly follow?","answer":"Central Avenue and Fountain Street","wrong":["Park and Whittington avenues","Malvern and Ouachita avenues","Reserve and Spring streets"],"explanation":"The beta fault follows the top edge of Hot Springs Mountain.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm","confidence":"confirmed"},{"id":"hs-0153","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"About how hot does Hot Springs' rainwater get deep underground before it rises?","answer":"About 160°F","wrong":["About 120°F","About 212°F","About 300°F"],"explanation":"It heats through the geothermal gradient roughly a mile down.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm","confidence":"confirmed"},{"id":"hs-0154","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"NPS calls the Hot Springs thermal springs the hottest east of what landmark?","answer":"The Rocky Mountains","wrong":["The Mississippi River","The Appalachian Mountains","The Ohio River"],"explanation":"NPS says the springs average 143 degrees Fahrenheit.","source":"NPS: Maurice Historic Display Spring","sourceUrl":"https://www.nps.gov/places/maurice-historic-display-spring.htm","confidence":"confirmed"},{"id":"hs-0155","category":"Nature & Lakes","difficulty":"medium","era":"any","question":"According to Wikipedia's water-chemistry table, which constituent of Hot Springs' thermal water has the highest concentration?","answer":"Bicarbonate","wrong":["Sulfur","Iron","Sodium chloride"],"explanation":"The table lists bicarbonate at 130.0 ppm, ahead of silica (53.0) and calcium (47.0).","source":"Wikipedia: Hot Springs National Park","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_National_Park","confidence":"confirmed"},{"id":"hs-0156","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"What is the white-to-tan rock deposited around Hot Springs' spring openings called?","answer":"Tufa (travertine)","wrong":["Novaculite","Obsidian","Shale"],"explanation":"Dissolved minerals in the water precipitate to form the white-to-tan travertine, or tufa rock, seen near the spring openings.","source":"Wikipedia: Hot Springs National Park","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_National_Park","confidence":"confirmed"},{"id":"hs-0157","category":"Nature & Lakes","difficulty":"medium","era":"any","question":"Which two cold water springs in Hot Springs National Park are treated using ozone filtration?","answer":"Happy Hollow and Whittington","wrong":["Display and Maurice","Ral and Noble","Three Sisters and Fordyce"],"explanation":"Wikipedia says drinking water comes from several hot water jug fountains; the two cold water springs, Happy Hollow and Whittington, are treated using ozone filtration.","source":"Wikipedia: Hot Springs National Park","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_National_Park","confidence":"confirmed"},{"id":"hs-0158","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"Which dissolved gas causes most of the slight radioactivity in Hot Springs' water?","answer":"Radon","wrong":["Helium","Chlorine","Methane"],"explanation":"Wikipedia says the measurable radioactivity is primarily due to dissolved radon gas, with some radium.","source":"Wikipedia: Hot Springs National Park","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs_National_Park","confidence":"confirmed"},{"id":"hs-0159","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"Into which lake does Hot Springs Creek empty after flowing under Bathhouse Row?","answer":"Lake Hamilton","wrong":["Lake Ouachita","Lake Catherine","DeGray Lake"],"explanation":"Wikipedia says the creek flows from Whittington Avenue through the southern city before emptying into Lake Hamilton.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas","confidence":"confirmed"},{"id":"hs-0160","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"What is the highest point in Hot Springs National Park?","answer":"Music Mountain","wrong":["Hot Springs Mountain","North Mountain","Sugarloaf Mountain"],"explanation":"NPS gives Music Mountain's elevation as 1405 feet.","source":"NPS: Sunset Trail","sourceUrl":"https://www.nps.gov/hosp/planyourvisit/sunset-trail.htm","confidence":"confirmed"},{"id":"hs-0161","category":"Nature & Lakes","difficulty":"easy","era":"any","question":"What is the longest trail in Hot Springs National Park?","answer":"Sunset Trail","wrong":["Grand Promenade","Peak Trail","Goat Rock Trail"],"explanation":"The Sunset Trail runs about 10 miles one way.","source":"NPS: Sunset Trail","sourceUrl":"https://www.nps.gov/hosp/planyourvisit/sunset-trail.htm","confidence":"confirmed"},{"id":"hs-0162","category":"Nature & Lakes","difficulty":"hard","era":"any","question":"What are the three sections of Hot Springs National Park's Sunset Trail?","answer":"West Mountain, Sugarloaf, Stonebridge Road","wrong":["Peak, Dogwood, Floral","Gulpha, Oertel, Reserve","Goat Rock, Honeysuckle, Fountain"],"explanation":"The sections are 2.8, 2.6 and 3.8 miles long.","source":"NPS: Sunset Trail","sourceUrl":"https://www.nps.gov/hosp/planyourvisit/sunset-trail.htm","c s Fordyce had a business interest in showing the expedition found Hot Springs; later research revised the commission's route.","source":"Encyclopedia of Arkansas: Route of the de Soto Expedition","sourceUrl":"https://encyclopediaofarkansas.net/entries/route-of-the-de-soto-expedition-7679/","confidence":"confirmed"},{"id":"hs-0282","category":"People","difficulty":"medium","era":"frontier","question":"Who built the first real settlement at the Arkansas hot springs in 1807 and lived there for two years?","answer":"Jean Pierre Emanuel Prudhomme","wrong":["Ludovicus Belding","Samuel Fordyce","George Hunter"],"explanation":"Prudhomme, an ailing Red River plantation owner, built the first real settlement; trappers Isaac Cates and John Percival joined him.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0283","category":"People","difficulty":"medium","era":"frontier","question":"Which early Hot Springs settler built cabins to rent to visiting health seekers?","answer":"John Percival","wrong":["Joseph Reynolds","Benjamin Kelley","Hiram Whittington"],"explanation":"Trapper John Percival built log cabins to rent to the growing number of visitors to the springs.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0284","category":"People","difficulty":"easy","era":"frontier","question":"Which Arkansas governor moved the state government to Hot Springs in 1862?","answer":"Henry M. Rector","wrong":["Augustus H. Garland","Sid McMath","Orval Faubus"],"explanation":"Gov. Henry Massie Rector moved state government to Hot Springs, which was the state capital from May 6 to July 14, 1862.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0285","category":"People","difficulty":"easy","era":"frontier","question":"Garland County, home of Hot Springs, is named after which Arkansas politician?","answer":"Augustus H. Garland","wrong":["Henry M. Rector","Hiram Whittington","Samuel W. Fordyce"],"explanation":"Garland was governor (1874), U.S. senator and U.S. attorney general.","source":"Encyclopedia of Arkansas: Garland County","sourceUrl":"https://encyclopediaofarkansas.net/entries/garland-county-770/","confidence":"confirmed"},{"id":"hs-0286","category":"People","difficulty":"medium","era":"gilded-spa","question":"Who arrived in October 1877 as the first superintendent of the Hot Springs Reservation?","answer":"Benjamin F. Kelley","wrong":["Samuel Hamblen","Stephen Mather","Robert R. Stevens"],"explanation":"Benjamin Franklin Kelley (1807-1891) was the first superintendent of Hot Springs Reservation, arriving in October 1877.","source":"NPS: People","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/people.htm","confidence":"confirmed"},{"id":"hs-0287","category":"People","difficulty":"easy","era":"gilded-spa","question":"Which of Joseph \"Diamond Jo\" Reynolds's businesses became known as the \"Diamond Jo Line\"?","answer":"His upper Mississippi steamboat fleet","wrong":["A riverboat casino","A cotton plantation","A timber mill"],"explanation":"Reynolds also ran a successful leather tanning company in Chicago and traded grain.","source":"Encyclopedia of Arkansas: Hot Springs Railroad","sourceUrl":"https://encyclopediaofarkansas.net/entries/hot-springs-railroad-14157","confidence":"confirmed"},{"id":"hs-0288","category":"People","difficulty":"medium","era":"gilded-spa","question":"Which U.S. senator, honored at an 1882 Palace Bathhouse dinner, promised to seek funding for a Hot Springs military hospital?","answer":"John A. Logan","wrong":["John C. Breckinridge","Augustus Garland","Joe T. Robinson"],"explanation":"Dr. A. S. Garnett, a former Confederate surgeon, hosted the dinner honoring Logan, a former Union general.","source":"Encyclopedia of Arkansas: Army-Navy Hospital","sourceUrl":"https://encyclopediaofarkansas.net/entries/Arkansas-Career-Training-Institute-2236","confidence":"confirmed"},{"id":"hs-0289","category":"People","difficulty":"medium","era":"gilded-spa","question":"Which Little Rock firm designed the Fordyce and Ozark bathhouses and the 1924 Arlington Hotel?","answer":"Mann & Stern","wrong":["Sanguinet & Staats","Almand & Stuck","Thompson, Sanders & Ginocchio"],"explanation":"George Mann and Eugene John Stern of Little Rock designed the Fordyce and Ozark, the 1914 Hale renovation and the 1915 Maurice remodel.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0290","category":"People","difficulty":"hard","era":"gilded-spa","question":"Which Hot Springs architect designed the 1916 Superior Bathhouse?","answer":"Harry C. Schwebke","wrong":["George Gleim Jr.","George Mann","W. T. Bailey"],"explanation":"Harry C. Schwebke of Hot Springs designed the Superior, completed in 1916 as the northernmost bathhouse on the Row.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0291","category":"People","difficulty":"hard","era":"gilded-spa","question":"Which Chicago architect designed Hot Springs' Maurice Bathhouse?","answer":"George Gleim Jr.","wrong":["Harry C. Schwebke","George Mann","W. T. Bailey"],"explanation":"The Maurice was built 1911–12 and remodeled by Mann & Stern in 1915.","source":"Wikipedia: Bathhouse Row","sourceUrl":"https://en.wikipedia.org/wiki/Bathhouse_Row","confidence":"confirmed"},{"id":"hs-0292","category":"People","difficulty":"hard","era":"gilded-spa","question":"Who built a wooden observation tower on Hot Springs Mountain in 1877?","answer":"Enoch Woolman","wrong":["Charles N. Rix","Benjamin F. Kelley","Hiram Whittington"],"explanation":"In 1906 the old Woolman Observatory was removed and a new steel tower opened on the mountain.","source":"NPS: Hot Springs Mountain Tower","sourceUrl":"https://www.nps.gov/places/hot-springs-mountain-tower.htm","confidence":"confirmed"},{"id":"hs-0293","category":"People","difficulty":"easy","era":"gilded-spa","question":"Who co-financed the first Arlington Hotel in 1875 with two partners?","answer":"Samuel W. Fordyce","wrong":["Leo P. McLaughlin","Al Capone","Harvey Couch"],"explanation":"Samuel W. Fordyce and two other entrepreneurs financed the first luxury hotel in the area, the first Arlington, which opened in 1875.","source":"Wikipedia: Arlington Hotel","sourceUrl":"https://en.wikipedia.org/wiki/Arlington_Hotel_(Hot_Springs_National_Park)","confidence":"confirmed"},{"id":"hs-0294","category":"People","difficulty":"hard","era":"gilded-spa","question":"Who founded the Ohio Club in Hot Springs in 1905?","answer":"John \"Coffee\" Williams and Sam Watt","wrong":["Charles Dugan and Dan Stuart","Dane Harris and Harry Hastings","Leo McLaughlin and Vern Ledgerwood"],"explanation":"Williams founded it with his nephew Sam Watt.","source":"Encyclopedia of Arkansas: Ohio Club","sourceUrl":"https://encyclopediaofarkansas.net/entries/ohio-club-9408/","confidence":"confirmed"},{"id":"hs-0295","category":"People","difficulty":"hard","era":"gilded-spa","question":"Which Tuskegee Institute architect designed Hot Springs' 1914 Pythian Bathhouse?","answer":"W. T. Bailey","wrong":["George Mann","George Gleim Jr.","Harry C. Schwebke"],"explanation":"Bailey also designed the Woodmen of the Union Building in 1922, according to the NPS.","source":"NPS: African Americans and the Hot Springs Baths","sourceUrl":"https://www.nps.gov/articles/000/african-americans-and-the-hot-springs-baths.htm","confidence":"confirmed"},{"id":"hs-0296","category":"People","difficulty":"hard","era":"gilded-spa","question":"Which ballpark architect designed Oaklawn's original 1904 clubhouse?","answer":"Zachary Taylor Davis","wrong":["George Mann", ing in 1886?","answer":"Albert Spalding","wrong":["Charles Comiskey","Ban Johnson","John McGraw"],"explanation":"EOA says A. G. Spalding, president of the White Stockings, decided to train in a warmer climate; Cap Anson was the playing-manager.","source":"Encyclopedia of Arkansas: Major League Spring Training in Hot Springs","sourceUrl":"https://encyclopediaofarkansas.net/?p=5896","confidence":"confirmed"},{"id":"hs-0301","category":"People","difficulty":"easy","era":"gilded-spa","question":"Which Hollywood actor was born in Hot Springs on Sept. 3, 1913?","answer":"Alan Ladd","wrong":["Billy Bob Thornton","Steve Barton","Roger Clinton Jr."],"explanation":"The list gives Alan Ladd as an actor born September 3, 1913, in Hot Springs.","source":"Good Time Oldies: famous people born in Arkansas","sourceUrl":"https://goodtimeoldies1075.com/did-you-know-these-16-famous-people-were-born-in-arkansas/","confidence":"confirmed"},{"id":"hs-0302","category":"People","difficulty":"hard","era":"gilded-spa","question":"Which future evangelist was a member of the 1886 White Stockings spring trip to Hot Springs?","answer":"Billy Sunday","wrong":["Billy Graham","Dwight L. Moody","Aimee Semple McPherson"],"explanation":"Mike \"King\" Kelly and John Clarkson, fellow Hall of Famers, were also with the 1886 White Stockings.","source":"Hot Springs Historic Baseball Trail: Hot Springs Baseball Grounds","sourceUrl":"https://hotspringsbaseballtrail.com/see-the-trail/hot-springs-baseball-grounds/","confidence":"confirmed"},{"id":"hs-0303","category":"People","difficulty":"medium","era":"roaring","question":"Which Arkansas senator accepted the 1928 Democratic vice-presidential nomination on the Arlington Hotel's steps?","answer":"Joe T. Robinson","wrong":["Sid McMath","Augustus Garland","Harvey Couch"],"explanation":"Robinson accepted the nomination on the front steps in 1928.","source":"Arlington Hotel: History","sourceUrl":"https://www.arlingtonhotel.com/history/","confidence":"confirmed"},{" teran led the 1946 GI Revolt against Hot Springs' political machine?","answer":"Sid McMath","wrong":["Leo P. McLaughlin","Owney Madden","Winthrop Rockefeller"],"explanation":"EoA calls McMath a hometown war hero who organized fellow WWII veterans to challenge the Hot Springs political establishment; he campaigned for governor in 1948.","source":"Encyclopedia of Arkansas: GI Revolt","sourceUrl":"https://encyclopediaofarkansas.net/entries/GI-Revolt-4157","confidence":"confirmed"},{"id":"hs-0309","category":"People","difficulty":"medium","era":"roaring","question":"Who became the first National Park Service ranger killed on duty, at Hot Springs in 1927?","answer":"James A. Cary","wrong":["Benjamin F. Kelley","Samuel Hamblen","Stephen Mather"],"explanation":"Cary was killed by bootleggers at Hot Springs National Park on March 12, 1927.","source":"NPS: James A. Cary","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/james-a-cary.htm","confidence":"confirmed"},{"id":"hs-0310","category":"People","difficulty":"easy","era":"roaring","question":"Which notorious gangster rented an entire floor of the Arlington Hotel in the 1930s?","answer":"Al Capone","wrong":["John Dillinger","Owney Madden","Machine Gun Kelly"],"explanation":"In the 1930s the Arlington was a favorite vacation spot for Al Capone, who rented out an entire floor for his staff and bodyguards.","source":"Wikipedia: Arlington Hotel","sourceUrl":"https://en.wikipedia.org/wiki/Arlington_Hotel_(Hot_Springs_National_Park)","confidence":"confirmed"},{"id":"hs-0311","category":"People","difficulty":"easy","era":"roaring","question":"Which long-serving Hot Springs mayor's political machine did the 1946 GI Revolt topple?","answer":"Leo P. McLaughlin","wrong":["Earl T. Ricks","Pat McCabe","Bob Wheeler"],"explanation":"Earl T. Ricks served as reform mayor in 1947-49.","source":"Wikipedia: Hot Springs, Arkansas","sourceUrl":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas","confidence":"confirmed"},{"id":"hs-0312","category":"People","difficulty":"medium","era":"roaring","question":"Lake Hamilton near Hot Springs is named for which Arkansas Power & Light executive?","answer":"Hamilton Moses","wrong":["Harvey Couch","Flavius J. Carpenter","Alexander Hamilton"],"explanation":"Carpenter Dam is named for Flavius Josephus Carpenter.","source":"Wikipedia: Lake Hamilton","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Hamilton_(Arkansas)","confidence":"confirmed"},{"id":"hs-0313","category":"People","difficulty":"easy","era":"roaring","question":"Lake Catherine near Hot Springs is named after whose daughter?","answer":"Harvey Couch's","wrong":["Hamilton Moses's","Samuel Fordyce's","Leo McLaughlin's"],"explanation":"Wikipedia says the lake is named after Harvey Couch's daughter, Catherine.","source":"Wikipedia: Lake Catherine","sourceUrl":"https://en.wikipedia.org/wiki/Lake_Catherine_(Arkansas)","confidence":"confirmed"},{"id":"hs-0314","category":"People","difficulty":"easy","era":"roaring","question":"Which famous woman athlete attended Hot Springs' Ray Doan baseball school in 1934?","answer":"Babe Didrikson","wrong":["Amelia Earhart","Katherine Stinson","Althea Gibson"],"explanation":"Instructors included Rogers Hornsby and Bob Feller.","source":"Wikipedia: Ban Johnson Park","sourceUrl":"https://en.wikipedia.org/wiki/Ban_Johnson_Park","confidence":"confirmed"},{"id":"hs-0315","category":"People","difficulty":"easy","era":"roaring","question":"Which New York gangster's parole barred him from ever returning to New York, so he settled in Hot Springs?","answer":"Owney Madden","wrong":["Al Capone","Lucky Luciano","Frank Costello"],"explanation":"Madden lived in Hot Springs until his death in 1965 at age 73.","source":"The Mob Museum: Hot Springs is soaked in mob lore","sourceUrl":"https://themobmuseum.org/blog/hot-springs-is-soaked-in-mob-lore/","confidence":"confirmed"},{"id":"hs-0316","category":"People","difficulty":"easy","era":"roaring","question":"Which New York Mafia boss was nd homer that day landed in the Alligator Farm.","source":"Wikipedia: Ban Johnson Park","sourceUrl":"https://en.wikipedia.org/wiki/Ban_Johnson_Park","confidence":"confirmed"},{"id":"hs-0482","category":"Legends & Oddities","difficulty":"easy","era":"gilded-spa","question":"What did Hot Springs' Government Free Bathhouse provide?","answer":"Free baths for those who couldn't pay","wrong":["Free train tickets","Free hotel rooms","Free whetstones"],"explanation":"NPS: it provided free bathing to health seekers who could not afford the pay bathhouses; a new bathhouse opened on Reserve and Spring Streets in 1922.","source":"NPS: History & Culture","sourceUrl":"https://www.nps.gov/hosp/learn/historyculture/index.htm","confidence":"confirmed"},{"id":"hs-0483","category":"Legends & Oddities","difficulty":"medium","era":"gilded-spa","question":"From where did H. L. Campbell bring the first alligators for Hot Springs' alligator farm?","answer":"The Florida Everglades","wrong":["The Louisiana bayous","Lake Ouachita","The Nile River"],"explanation":"The farm first raised gators for hides and sold live ones to zoos.","source":"Encyclopedia of Arkansas: Arkansas Alligator Farm and Petting Zoo","sourceUrl":"https://encyclopediaofarkansas.net/entries/arkansas-alligator-farm-and-petting-zoo-20827/","confidence":"confirmed"},{"id":"hs-0484","category":"Legends & Oddities","difficulty":"easy","era":"gilded-spa","question":"What alleged \"mummified creature\" was shown in the Arkansas Alligator Farm's early museum?","answer":"A \"Merman\"","wrong":["A two-headed gator","A Bigfoot hand","A unicorn horn"],"explanation":"The Encyclopedia of Arkansas says the farm's museum displayed a \"Merman,\" said to be a mummified aquatic creature.","source":"Encyclopedia of Arkansas: Arkansas Alligator Farm and Petting Zoo","sourceUrl":"https://encyclopediaofarkansas.net/entries/arkansas-alligator-farm-and-petting-zoo-20827/","confidence":"confirmed"},{"id":"hs-0485","category":"Legends & Oddities","d 712/","confidence":"confirmed"},{"id":"hs-0489","category":"Legends & Oddities","difficulty":"medium","era":"roaring","question":"What flower did Hot Springs mayor Leo McLaughlin wear on his daily ride down Central Avenue?","answer":"A red carnation","wrong":["A white rose","A yellow tulip","A blue violet"],"explanation":"McLaughlin rode daily down Central Avenue in a horse-drawn sulky, wearing riding clothes and a red carnation in his lapel.","source":"Encyclopedia of Arkansas: Leo P. McLaughlin","sourceUrl":"https://encyclopediaofarkansas.net/entries/leo-patrick-mclaughlin-1712/","confidence":"confirmed"},{"id":"hs-0490","category":"Legends & Oddities","difficulty":"easy","era":"roaring","question":"Which organization designated Hot Springs' Bridge Street \"the shortest street in the world\" in the 1940s?","answer":"Ripley's Believe It or Not","wrong":["Guinness World Records","National Geographic","Life magazine"],"explanation":"Per the ACHP page, Bridge Street became famous in the 1940s when Ripley's Believe It or Not gave it that designation.","source":"ACHP: The Hot Springs National Park Visitors Center","sourceUrl":"https://www.achp.gov/node/8710","confidence":"confirmed"},{"id":"hs-0491","category":"Legends & Oddities","difficulty":"medium","era":"roaring","question":"Which of these was the name of one of Thomas Cockburn's largest and most popular ostriches at Hot Springs' Ostrich Farm?","answer":"Black Diamond","wrong":["Big Red","Old Smoky","Lady Liberty"],"explanation":"The Encyclopedia of Arkansas says Black Diamond and Whirlwind, among Cockburn's largest ostriches, became quite popular; the birds were almost ten feet tall and about 400 pounds.","source":"Encyclopedia of Arkansas: Ostrich Farm","sourceUrl":"https://encyclopediaofarkansas.net/entries/ostrich-farm-in-hot-springs-4429/","confidence":"confirmed"},{"id":"hs-0492","category":"Legends & Oddities","difficulty":"medium","era":"roaring","question":"Where in Hot Springs was Lucky Luciano walking when he was arrested in 1936?","answer":"Along Bathhouse Row","wrong":["At Oaklawn Park","At the Vapors","At the train depot"],"explanation":"Legends of America says he was arrested while walking on federal property along Bathhouse Row.","source":"Legends of America: Hot Springs gangsters","sourceUrl":"https://www.legendsofamerica.com/hot-springs-arkansas-gangsters/","confidence":"confirmed"},{"id":"hs-0493","category":"Legends & Oddities","difficulty":"hard","era":"roaring","question":"What was Hot Springs' alligator farm called under owner Danny Older around 1929?","answer":"The Hot Springs Gator Farm","wrong":["Gator Gulch","The Reptile Ranch","Croc Spa"],"explanation":"Jack Bridges Sr. bought it in 1947, and it became the Arkansas Alligator Farm.","source":"Encyclopedia of Arkansas: Arkansas Alligator Farm and Petting Zoo","sourceUrl":"https://encyclopediaofarkansas.net/entries/arkansas-alligator-farm-and-petting-zoo-20827/","confidence":"confirmed"},{"id":"hs-0494","category":"Legends & Oddities","difficulty":"medium","era":"midcentury","question":"What did Tiny Town creator Frank Moshinskie make out of cat-food cans?","answer":"Miniature trees","wrong":["Tiny cars","Roof tiles","Street lamps"],"explanation":"Roadside America says the trees are made from cat food cans and wire; Tiny Town moved to its current building in 1963.","source":"Roadside America: Tiny Town","sourceUrl":"https://www.roadsideamerica.com/story/11287","confidence":"confirmed"},{"id":"hs-0495","category":"Legends & Oddities","difficulty":"medium","era":"midcentury","question":"Which trained animals at Hot Springs' IQ Zoo walked tightropes and handed out fortune cards?","answer":"Chickens","wrong":["Dolphins","Monkeys","Goats"],"explanation":"The entry says the Brelands opened the IQ Zoo in 1955; rabbits, ducks and raccoons also performed there.","source":"Encyclopedia of Arkansas: Keller Bramwell Breland","sourceUrl":"https://encyclopediaofarkansas.net/?p=3997","confidence":"confirmed"},{"id": // ---------- setup ----------

function setupHTML() {
  const su = ui.setup || (ui.setup = defaultSetup());
  const names = Game.defaultNames(su.seats);
  const rows = su.seats.map((s, i) => `<li class="seat">
      ${tokenIco({ shape: ['circle', 'square', 'triangle', 'diamond', 'star', 'hexagon'][i], color: ['#D7263D', '#1D5BD6', '#14904A', '#F2A90C', '#8A43C4', '#F4F1EA'][i] }, 26)}
      <label class="sr-only" for="seat-name-${i}">Seat ${i + 1} name (${TOKEN_NAMES[i]} token)</label>
      <input id="seat-name-${i}" data-key="name${i}" data-seat="${i}" class="seat-name" maxlength="16" placeholder="${esc(names[i])}" value="${esc(s.name)}">

      <select id="seat-kind-${i}" data-key="kind${i}" data-seatkind="${i}">
        ${[['human', 'Human'], ['ai:easy', 'AI · Easy'], ['ai:medium', 'AI · Medium'], ['ai:hard', 'AI · Hard']].map(([v, l]) => `<option value="${v}"${(s.kind === 'human' ? 'human' : 'ai:' + s.level) === v ? ' selected' : ''}>${l}</option>`).join('')}
      </select>
      ${su.seats.length > 1 ? btn('seat-remove', '<span aria-hidden="true">✕</span><span class="sr-only">Remove seat ' + (i + 1) + '</span>', { arg: String(i), cls: 'icon' }) : ''}

    ${su.seats.length < 6 ? btn('seat-add', '+ Add a traveler', { cls: 'ghost' }) : ''}
    <h3>Stamps to collect</h3>
    <div class="seg" role="radiogroup" aria-label="Stamps to collect">${Game.TARGETS.map((x) => `<button class="seg-b${su.target === x.n ? ' on' : ''}" role="radio" aria-checked="${su.target === x.n}" data-act="target" data-arg="${x.n}" data-key="target${x.n}">${x.label}<small>${x.n} stamps</small></button>`).join('')}</div>
    <p class="hint">Answer timer: <strong>${G.state.settings.timer ? G.state.settings.timer + ' s' : 'Off'}</strong> · change it in Settings. Hot-seat: pass the device when the screen says so.</p>
    <div class="row">${btn('goto', 'Back', { arg: 'title', cls: 'ghost' })}${btn('start-trail', 'Start the trip', { cls: 'primary' })}</div>
  </div>`;

// ---------- game panel ----------
// The roll shows on a steam-pressure gauge: the needle swings once per new roll, then rests on the number.
function gaugeHTML(t) {
  const key = t.round + ':' + t.turn + ':' + t.roll;
  const spin = ui.gaugeKey !== key; ui.gaugeKey = key;
  const ang = (i) => -135 + (i - 1) * 54;
  const marks = [1, 2, 3, 4, 5, 6].map((i) => {
    const a = ((ang(i) - 90) * Math.PI) / 180;
    return `<text x="${(30 + Math.cos(a) * 17).toFixed(1)}" y="${(31.6 + Math.sin(a) * 17).toFixed(1)}"${i === t.roll ? ' class="on"' : ''}>${i}</text>`;
  }).join('');
  return `<svg class="gauge${spin ? ' spin' : ''}" viewBox="0 0 60 60" style="--a:${ang(t.roll)}deg" aria-hidden="true"><circle cx="30" cy="30" r="28" class="g-rim"/><circle cx="30" cy="30" r="24.5" class="g-face"/><path class="g-arc" d="M11.6 48.4 A26 26 0 1 1 48.4 48.4"/>${marks}<g class="g-needle"><path d="M30 32 L30 10"/><circle cx="30" cy="30" r="3.4"/></g></svg>`;
}
function stampPips(p) {
  return `<span class="pips" aria-label="${p.stamps.length} stamps">${DISTRICTS.map((d) => { const have = p.stamps.includes(d.cat); const c = CAT[d.cat]; return have ? ico(c.icon, c.color, c.ink, 16, 'pip') : '<span class="pip empty"></span>'; }).join('')}</span>`;
}

function panelHTML() {
  const t = Game.T(); if (!t) return '';
  const p = Game.cur(); const ai = p.kind === 'ai';
  let action = '';
  const who = `<strong>${esc(p.name)}</strong>`;
  switch (t.phase) {
    case 'roll':
      action = ai ? `<p class="status">${who} is getting ready…</p>` :
        `${btn('roll', 'Roll the steam gauge', { cls: 'primary big', hint: 'Space', auto: true })}
         ${Game.canTrolley(p) ? btn('trolley-open', 'Ride the trolley · 2 tickets', { cls: 'ghost', hint: 'T' }) : ''}`;
      break;
    case 'choose': {
      const list = t.dests.map((d, i) => {
        const n = NODES[d.node]; const c = n.cat ? CAT[n.cat] : null;
        const kind = n.type === 'landmark' ? `Landmark · ${c.short}` : n.type === 'cat' ? c.short : { vent: 'Steam vent', wager: 'Post Time wager', warp: 'Time Warp', postcard: 'Postcard', jury: 'Grand Jury', trolley: 'Trolley stop', start: 'The Y · trolley', trailhead: 'Trailhead', trail: 'Mountain trail', tower: 'Mountain Tower!' }[n.type];
        const dn = n.district && DISTRICT[n.district] ? DISTRICT[n.district].name : n.district === 'mountain' ? 'Hot Springs Mountain' : 'Downtown';
        return `<li><button class="dest${i === t.sel ? ' sel' : ''}" data-act="choose" data-arg="${d.node}" data-key="dest${d.node}"${ai ? ' disabled' : ''} aria-current="${i === t.sel}">
          <span class="num" aria-hidden="true">${i + 1}</span>${c && (n.type === 'cat' || n.type === 'landmark') ? ico(c.icon, c.color, c.ink, 24) : ico(n.type === 'tower' ? 'tower' : n.type === 'trail' ? 'trailhead' : ({ start: 'star' }[n.type] || n.type), '', 'currentColor', 24)}
          <span class="dtext"><span class="dname">${esc(n.name)}</span><span class="dsub">${esc(kind)} · ${esc(dn)}</span></span></button></li>`;
      }).join('');
      action = `<p class="status rolled">${gaugeHTML(t)}<span>${who} rolled <span class="die" aria-label="${t.roll}">${t.roll}</span> ${ai ? 'and is choosing…' : '— pick where to stop:'}</span></p>
        <ol class="dests" aria-label="Destinations">${list}</ol>
        ${!ai && !t.rerolled ? btn('reroll', 'Re-roll · 1 ticket', { cls: 'ghost small', hint: 'R', dis: p.tickets < 1 }) : ''}`;
      break;
    }
    case 'moving': action = `<p class="status">${who} is on the move…</p>`; break;
    case 'skipped': action = `<p class="status">${who} sits out this turn.</p>`; break;
    case 'stuck': action = `<p class="status">No space is exactly ${t.roll} away — ${who} waits in the steam.</p>`; break;
    case 'landed': action = `<p class="status">${who} stops at ${esc(NODES[p.node].name)}.</p>`; break;
    case 'over': action = `<p class="status">${who} wins!</p>`; break;
    default: action = `<p class="status">${who} ${ai ? 'is thinking…' : ['question', 'feedback'].includes(t.phase) ? 'answers at ' + esc(NODES[p.node].name) : '— your move'}</p>`;
  }
  const players = t.players.map((q, i) => `<li class="pl${i === t.turn ? ' on' : ''}" style="--pc:${q.color}">${tokenIco(q, 30)}
      <span class="pname">${esc(q.name)}${q.kind === 'ai' ? ` <small>AI · ${q.level}</small>` : ''}${q.skip ? ' <small class="warn">skips next</small>' : ''}</span>
      ${stampPips(q)}<span class="pstat"><span>${q.stamps.length}/${t.target}</span><span class="tix" title="Bath tickets">${TICKET}<span class="sr-only">tickets:</span> ${q.tickets}</span></span></li>`).join('');
  const el = Game.eligible(p);
  // Where the active token stands: the district painting, its blurb and the space name.
  const here = NODES[p.node]; const hd = here.district && DISTRICT[here.district];
  const hsrc = hd ? artSrc('land-' + hd.key) : here.district === 'mountain' ? artSrc('land-tower') : artSrc('land-row');
  const hname = hd ? hd.name : here.district === 'mountain' ? 'Hot Springs Mountain' : 'Downtown';
  const herecard = hsrc ? `<figure class="here"><img src="${hsrc}" alt="" aria-hidden="true"><figcaption><strong>${esc(here.name)}</strong><span>${esc(hname)}${hd ? ' · ' + esc(hd.blurb) : ''}</span></figcaption></figure>` : '';
  return `<div class="turn" style="--pc:${p.color}">${tokenIco(p, 44)}<div><div class="tname">${esc(p.name)}’s turn</div><div class="tsub">Round ${t.round} · ${p.stamps.length}/${t.target} stamps · ${plural(p.tickets, 'ticket')}${el ? ' · <strong class="ok">Trail open!</strong>' : ''}</div></div></div>
    <div class="action">${action}</div>
    ${herecard}
    <ol class="players" aria-label="Travelers">${players}</ol>
    <div class="tools">${btn('passport', 'Passport', { cls: 'ghost small', hint: 'P' })}${btn('menu', 'Menu', { cls: 'ghost small', hint: 'Esc' })}</div>
    <ul class="log" aria-label="Recent events">${t.log.slice(0, 4).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>`;
}

// ---------- question card ----------
function questionCardHTML(q, { purposeLine = '', allowLifeline = false, tickets = 0, canAnswer = true } = {}) {
  const c = CAT[q.category];
  const answered = q.chosen !== null;
  const badge = q.confidence === 'claim' ? '<span class="badge claim" title="This is how the place bills itself; not independently verified.">Local claim</span>'
    : q.confidence === 'summary' ? '<span class="badge summary" title="Supported by a search summary rather than a full source read.">Lightly verified</span>' : '';
  const answers = q.choices.map((txt, i) => {
    const gone = q.removed.includes(i);
    let cls = 'ans';
    if (answered) { if (i === q.correctIndex) cls += ' right'; else if (i === q.chosen) cls += ' wrong'; else cls += ' dim'; }
    if (gone) cls += ' gone';
    const mark = answered && i === q.correctIndex ? '<span class="mark" aria-label="correct answer">✔</span>' : answered && i === q.chosen ? '<span class="mark" aria-label="your answer">✘</span>' : '';
    if (answered && i === q.correctIndex && q.correct) cls += ' burst';
    return `<button class="${cls}" data-act="answer" data-arg="${i}" data-key="ans${i}"${answered || gone || !canAnswer ? ' disabled' : ''}${!answered && i === 0 && canAnswer ? ' data-autofocus' : ''}><span class="key" aria-hidden="true">${'ABCD'[i]}</span><span class="atext">${esc(txt)}</span>${mark}</button>`;
  }).join('');
  const dist = DIST_OF[q.category];
  const art = cardArt(q); const banner = art && art.src;
  const fresh = !answered;
  if (fresh && ui.revealQ !== q.id) { ui.revealQ = q.id; ui.revealAt = performance.now(); }
  if (answered && ui.answeredQ !== q.id) { ui.answeredQ = q.id; ui.answerAt = performance.now(); }
  const slam = answered && dist && (q.outcome || []).some((o) => o.startsWith('Stamp earned')) ? `<div class="slam" aria-hidden="true">${stampImg(dist, true, 104)}</div>` : '';
  const gain = answered && q.correct ? (q.outcome || []).find((o) => /^\+\d|^Won \d/.test(o)) : null;
  const fly = gain ? `<span class="flyup" aria-hidden="true">${esc(gain.replace(/^Won /, '+'))}</span>` : '';
  const fb = answered ? `<div class="fb ${q.correct ? 'ok' : 'bad'}" role="status">${slam}${fly}
      <p class="verdict">${q.correct ? 'Correct!' : q.chosen === -1 ? 'Time’s up!' : 'Not quite.'} ${q.outcome && q.outcome.length ? `<span class="outcome">${esc(q.outcome.join(' · '))}</span>` : ''}</p>
      ${!q.correct ? `<p class="ansline">Answer: <strong>${esc(q.choices[q.correctIndex])}</strong></p>` : ''}
      <p class="expl">${esc(q.explanation)}</p>
      <p class="src">Source: ${esc(q.source)}</p></div>` : '';
  return `<div class="qcard${banner ? ' has-art' : ''}${fresh ? ' reveal' : ''}${slam ? ' slammed' : ''}" style="--cat:${c.color};--catink:${c.ink}">
    ${banner ? `<div class="qbanner"><img class="qart" src="${banner}" alt="" aria-hidden="true"><span class="qcap">Illustration · ${esc(art.name)}</span></div>` : ''}
    <div class="qhead">${ico(c.icon, c.color, c.ink, 40)}<div class="qh"><div class="qcat" id="mtitle">${esc(q.category)}</div><div class="qmeta">${DIFF_LABEL[q.difficulty]} · ${esc(eraName(q.era))}</div></div>${badge}</div>
    ${purposeLine ? `<p class="purpose">${purposeLine}</p>` : ''}
    ${q.timeMax && !answered ? `<div class="timer" role="timer" aria-label="Time left"><div class="bar" style="width:${(100 * q.timeLeft / q.timeMax).toFixed(1)}%"></div></div>` : ''}
    <h2 class="qtext">${esc(q.text)}</h2>
    <div class="answers">${answers}</div>
    ${!answered && allowLifeline ? `<div class="qtools">${btn('lifeline', '50/50 · 2 tickets', { cls: 'ghost small', hint: 'F', dis: tickets < 2 || q.removed.length > 0 })}</div>` : ''}
    ${fb}
  </div>`;
}

// ---------- game modals ----------
function modalHTML() {
  const t = Game.T(); if (!t) return '';
  if (ui.menuOpen) return menuHTML();
  if (ui.modal === 'passport') return passportHTML();
  if (ui.modal === 'trolley') return trolleyHTML();
  const p = Game.cur(); const ai = p.kind === 'ai'; const q = G.state.question; const pd = t.pending;
  const cont = (label = 'Continue') => ai ? `<p class="hint ai-note">${esc(p.name)} will continue…</p>` + btn('proceed', label + ' now', { cls: 'ghost small', hint: 'Enter' }) : btn('proceed', label, { cls: 'primary', hint: 'Enter', auto: true });
  switch (t.phase) {
    case 'pass': return `<div class="mcard center"><h2 id="mtitle">Pass the device</h2>${tokenIco(p, 56)}<p class="big">to <strong>${esc(p.name)}</strong></p><p class="hint">Others, look away from the next question!</p>${btn('pass', `I’m ${esc(p.name)} — let’s go`, { cls: 'primary', hint: 'Enter', auto: true })}</div>`;
    case 'question': case 'feedback': {
      const n = NODES[p.node];
      const stampOf = () => (DISTRICT[n.district] ? DISTRICT[n.district].stamp : '');
      const purpose = ({
        district: () => `<span class="chip-pay">+${({ easy: 1, medium: 2, hard: 3 })[q.difficulty]} ${({ easy: 1, medium: 2, hard: 3 })[q.difficulty] === 1 ? 'ticket' : 'tickets'}</span> ${esc(n.name)}`,
        landmark: () => q.hadStamp ? `${esc(n.name)} · you already hold this stamp — answer for 2 tickets` : `<strong>Landmark!</strong> Answer to win the <strong>${esc(stampOf())}</strong> stamp`,
        warpLandmark: () => `<strong>Time-warp landmark!</strong> Answer to win the <strong>${esc(stampOf())}</strong> stamp`,
        wager: () => `<strong>Post Time</strong> · wager: ${plural(q.wager || 0, 'ticket')}${q.difficulty === 'hard' ? ' · hard question pays double' : ''}`,
        jury: () => '<strong>Grand Jury</strong> · miss it and you sit out your next turn',
        summit: () => '<strong>Summit question</strong> · answer correctly to win the game!',
      }[q.purpose] || (() => ''))();
      const card = questionCardHTML(q, { purposeLine: purpose, allowLifeline: !ai, tickets: p.tickets, canAnswer: !ai });
      return `${ai && q.chosen === null ? `<p class="ai-banner">${esc(p.name)} is answering…</p>` : ''}${card}${q.chosen !== null ? `<div class="mfoot">${cont(q.purpose === 'summit' && q.correct ? 'Celebrate' : 'Continue')}</div>` : ''}`;
    }
    case 'vent': {
      const to = NODES[pd.to];
      return `<div class="mcard"><div class="mhead">${ico('vent', '#2A9D8F', '#FFFFFF', 44)}<h2 id="mtitle">Steam vent</h2></div>
        <p>The springs average about 143 °F. Ride the steam to <strong>${esc(to.name)}</strong> in ${esc(DISTRICT[to.district].name)}?</p>
        ${NODES[p.node].district === 'row' || to.district === 'row' ? '<p class="fact">Hot Springs Creek runs in a tunnel under Bathhouse Row and empties into Lake Hamilton.</p>' : ''}
        <div class="row">${ai ? '<p class="hint">Deciding…</p>' : btn('vent', 'Ride the steam', { arg: '1', cls: 'primary', hint: 'Y', auto: true }) + btn('vent', 'Stay here', { arg: '0', cls: 'ghost', hint: 'N' })}</div></div>`;
    }
    case 'wager': {
      const max = Math.min(5, p.tickets);
      const opts = Array.from({ length: max + 1 }, (_, i) => btn('wager', String(i), { arg: String(i), cls: 'chip' + (i === Math.min(2, max) ? ' primary' : ''), hint: '', auto: i === Math.min(2, max), dis: ai })).join('');
      return `<div class="mcard"><div class="mhead">${ico('wager', '#56B4E9', '#10233A', 44)}<h2 id="mtitle">Post Time at Oaklawn</h2></div>
        <p>Wager up to 5 of your ${plural(p.tickets, 'ticket')} on the next question (any category). Right: win the wager — <strong>double</strong> on a hard question. Wrong: lose it.</p>
        <div class="chips" aria-label="Wager">${opts}</div>${ai ? '<p class="hint">Placing a bet…</p>' : '<p class="hint key-hint">Keys 0–5</p>'}</div>`;
    }
    case 'order': case 'orderResult': {
      const done = t.phase === 'orderResult';
      const evs = pd.events;
      const right = [0, 1, 2].sort((a, b) => evs[a].y - evs[b].y);
      const items = evs.map((e, i) => {
        const at = pd.picks.indexOf(i);
        return `<button class="ev${at >= 0 ? ' picked' : ''}" data-act="order-pick" data-arg="${i}" data-key="ev${i}"${done || at >= 0 || ai ? ' disabled' : ''}${!done && i === 0 ? ' data-autofocus' : ''}>
          <span class="evn" aria-hidden="true">${at >= 0 ? at + 1 : '·'}</span><span class="evt">${esc(e.e)}${done ? ` <strong class="yr">${e.y}</strong>` : ''}</span><span class="kbd" aria-hidden="true">${i + 1}</span></button>`;
      }).join('');
      return `<div class="mcard"><div class="mhead">${ico('warp', '#5B4A8B', '#FFFFFF', 44)}<h2 id="mtitle">Time Warp</h2></div>
        <p>${done ? (pd.ok ? '<strong class="ok">In order — the time warp opens!</strong> Next, choose a landmark to warp to.' : '<strong class="bad">Not quite.</strong> The right order:') : 'Tap the events from <strong>oldest</strong> to <strong>newest</strong>.'}</p>
        <div class="events">${items}</div>
        ${done ? `<ol class="order-key">${right.map((i) => `<li><strong>${evs[i].y}</strong> ${esc(evs[i].e)} <small>(${esc(evs[i].s)})</small></li>`).join('')}</ol><div class="mfoot">${cont()}</div>` : ''}</div>`;
    }
    case 'warp': {
      const list = pd.options.map((id, i) => { const n = NODES[id]; const c = n.cat ? CAT[n.cat] : null; return btn('warp', `${c ? ico(c.icon, c.color, c.ink, 22) : ''}<span>${esc(n.name)}</span><small>${esc(DISTRICT[n.district] ? DISTRICT[n.district].name : '')}</small>`, { arg: String(id), cls: 'listb', hint: String(i + 1), auto: i === 0, dis: ai }); }).join('');
      return `<div class="mcard"><div class="mhead">${ico('warp', '#5B4A8B', '#FFFFFF', 44)}<h2 id="mtitle">Warp to a landmark</h2></div><p>Pick a landmark you don’t have yet. You’ll answer its question right away.</p><div class="list">${list}</div></div>`;
    }
    case 'postcard': {
      const ev = pd.ev; const era = ERA[ev.era];
      return `<div class="mcard postcard"><div class="pc-stamp" aria-hidden="true">${ev.y}</div><p class="pc-greet" id="mtitle">Greetings from Hot Springs</p>
        <p class="pc-year">${ev.y} · ${esc(era ? era.name : '')}</p><p class="pc-text">${esc(ev.e)}</p><p class="src">Source: ${esc(ev.s)}</p><p class="outcome">+1 ticket</p><div class="mfoot">${cont()}</div></div>`;
    }
    case 'jury': return `<div class="mcard"><div class="mhead">${ico('jury', '#9A2A1C', '#FFFFFF', 44)}<h2 id="mtitle">Grand Jury!</h2></div><p>You’ve been called before the grand jury. Answer a <strong>Legends &amp; Oddities</strong> question, or sit out your next turn.</p><div class="mfoot">${cont('Face the jury')}</div></div>`;
    case 'summit': {
      const c = CAT[pd.cat];
      const tw = artSrc('land-tower');
      return `<div class="mcard center summit">${tw ? `<div class="mbanner"><img src="${tw}" alt="" aria-hidden="true"></div>` : ''}<div class="mhead">${ico('tower', '#8C877C', '#FFFFFF', 44)}<h2 id="mtitle">The Summit question</h2></div><p>You climbed to the 216-ft Mountain Tower. The weather vane swings to…</p><p class="vane">${ico(c.icon, c.color, c.ink, 48)}<strong>${esc(c.id)}</strong></p><p class="hint">A hard question. Get it right to win; miss and you head back to the trailhead.</p><div class="mfoot">${cont('Take the question')}</div></div>`;
    }
    default: return '';
  }
}

function passportHTML() {
  const t = Game.T(); const p = Game.cur();
  const stamps = DISTRICTS.map((d) => { const have = p.stamps.includes(d.cat); const cs = p.catStats[d.cat] || [0, 0];
    return `<li class="stamp${have ? ' have' : ''}">${stampImg(d, have)}
      <div><strong>${esc(d.name)}</strong><small>${esc(d.cat)} · ${have ? 'stamped' : 'not yet'}</small><small>${esc(d.blurb)}</small><small>${cs[1] ? `${cs[0]}/${cs[1]} right` : 'no questions yet'}</small></div></li>`; }).join('');
  return `<div class="mcard passport"><div class="pp-cover"><span class="pp-seal" aria-hidden="true">♨</span><h2 id="mtitle">${esc(p.name)}’s passport</h2><span class="pp-sub">Valley of Vapors · Hot Springs</span></div>
    <p>${p.stamps.length} of ${t.target} stamps needed · ${plural(p.tickets, 'ticket')} · ${p.answered ? Math.round((100 * p.correct) / p.answered) : 0}% right</p>
    <ul class="stamps">${stamps}</ul>
    <p class="hint">Stamps come from answering correctly on a district’s gold-ringed landmark. ${Game.eligible(p) ? 'Your trail to the Mountain Tower is open — head to the Grand Promenade trailhead behind Bathhouse Row.' : ''}</p>
    <div class="mfoot">${btn('close-modal', 'Close', { cls: 'primary', hint: 'Esc', auto: true })}</div></div>`;

    if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) down.moved = true;
    if (down.moved && R.view.mode === 'follow') { R.panBy(dx, dy); down.x = e.clientX; down.y = e.clientY; }
  });
  cv.addEventListener('pointerup', (e) => {
    if (!down) return; const moved = down.moved; down = null;
    if (moved || G.state.scene !== 'game') return;
    const t = G.state.trail; if (!t || Game.cur().kind !== 'human') return;
    const r = cv.getBoundingClientRect(); const hit = R.hitDest(e.clientX - r.left, e.clientY - r.top, t);
    if (hit === null) return;
    if (t.phase === 'choose') Game.choose(hit); else if (t.phase === 'warp') Game.warp(hit);
  });

  document.addEventListener('keydown', onKey);
}

function onKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  unlockAudio();
  const k = e.key; const ae = document.activeElement;
  const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA');
  if (typing && k !== 'Escape') return;
  // Let a focused button handle its own Enter/Space activation.
  if ((k === 'Enter' || k === ' ') && ae && ae.tagName === 'BUTTON') return;
  const st = G.state; const sc = st.scene; const lower = k.toLowerCase();
  const done = () => e.preventDefault();
  if (lower === 'm') { document.querySelector('#btn-sound').click(); return done(); }
  if (k === '?') { goto('help'); return done(); }
  if (k === 'Tab') return trapFocus(e);
  if (sc === 'quiz') {
    const q = st.question; if (!q) return;
    if (q.chosen === null) { const i = answerKey(lower); if (i >= 0 && !q.removed.includes(i)) { act('answer', i); return done(); } }
    else if (k === 'Enter' || k === ' ') { act('quiz-next'); return done(); }
    if (k === 'Escape') { scene('title'); return done(); }
    return;
  }
  if (sc !== 'game') {
    if (k === 'Escape' && sc !== 'title') { act(sc === 'help' || sc === 'settings' ? 'back' : 'goto', 'title'); return done(); }
    return;
  }
  // ---- game scene ----
  if (k === 'Escape') { if (ui.modal || ui.menuOpen) act('close-modal'); else act('menu'); return done(); }
  if (ui.menuOpen) return;
  if (ui.modal === 'trolley') { const n = +k; const opts = Game.trolleyOptions(); if (n >= 1 && n <= opts.length) { act('trolley', opts[n - 1]); return done(); } return; }
  if (ui.modal) return;
  if (lower === 'p') { act('passport'); return done(); }
  if (lower === 'z') { act('zoom'); return done(); }
  const t = st.trail; const p = Game.cur(); if (!t || p.kind !== 'human') {
    if ((k === 'Enter' || k === ' ') && ['feedback', 'postcard', 'orderResult'].includes(t && t.phase)) { act('proceed'); return done(); }
    return;
  }
  switch (t.phase) {
    case 'pass': if (k === 'Enter' || k === ' ') { act('pass'); return done(); } break;
    case 'roll':
      if (k === ' ' || lower === 'r' || k === 'Enter') { act('roll'); return done(); }
      if (lower === 't') { act('trolley-open'); return done(); }
      break;
    case 'choose':
      if (k === 'ArrowRight' || k === 'ArrowDown') { Game.selectDest(1); return done(); }
      if (k === 'ArrowLeft' || k === 'ArrowUp') { Game.selectDest(-1); return done(); }
      if (k === 'Enter' || k === ' ') { Game.choose(); return done(); }
      if (lower === 'r') { act('reroll'); return done(); }
      if (/^[1-9]$/.test(k) && +k <= t.dests.length) { Game.choose(t.dests[+k - 1].node); return done(); }
      break;
    case 'question': {
      const q = st.question; const i = answerKey(lower);
      if (i >= 0 && !q.removed.includes(i)) { act('answer', i); return done(); }
      if (lower === 'f') { act('lifeline'); return done(); }
      break;
    }
    case 'feedback': case 'postcard': case 'orderResult': case 'jury': case 'summit':
      if (k === 'Enter' || k === ' ') { act('proceed'); return done(); }
      break;
    case 'vent': if (lower === 'y') { act('vent', '1'); return done(); } if (lower === 'n') { act('vent', '0'); return done(); } break;
    case 'wager': if (/^[0-5]$/.test(k) && +k <= Math.min(5, p.tickets)) { act('wager', k); return done(); } break;
    case 'order': if (/^[1-3]$/.test(k)) { act('order-pick', +k - 1); return done(); } break;
    case 'warp': if (/^[1-9]$/.test(k) && +k <= t.pending.options.length) { act('warp', t.pending.options[+k - 1]); return done(); } break;
    default:
  }
}
const answerKey = (l) => ({ a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 }[l] ?? -1);

function trapFocus(e) {
  const modal = document.querySelector('#modal');
  if (modal.hidden) return;
  const f = [...modal.querySelectorAll('button:not([disabled]), input, select, textarea')];
  if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && (i <= 0)) { f[f.length - 1].focus(); e.preventDefault(); }
  else if (!e.shiftKey && (i === f.length - 1 || i === -1)) { f[0].focus(); e.preventDefault(); }
}

// ---------- loop ----------
let lastT = 0; let tickSec = -1; let fpsFrames = 0;
function loop(ts) {
  // Animation steps are capped at 50 ms so a stall never teleports tokens; the answer timer runs on wall-clock
  // time (capped at 0.5 s for a backgrounded tab), so a 10 s timer is 10 s even on a slow device.
  const raw = lastT ? (ts - lastT) / 1000 : 0.016; const dt = Math.min(0.05, raw); const tdt = Math.min(0.5, raw); lastT = ts; fpsFrames++;
  const st = G.state;
  // question timer (humans only in the Trail Game)
  const q = st.question;
  const human = st.mode !== 'trail' || (st.trail && Game.cur().kind === 'human');
  const open = q && q.chosen === null && q.timeMax > 0 && human && !ui.modal && !ui.menuOpen && (st.scene === 'quiz' || (st.scene === 'game' && st.trail.phase === 'question'));
  if (open) {
    q.timeLeft -= tdt;
    const sec = Math.ceil(q.timeLeft);
    if (sec !== tickSec && sec <= 5 && sec > 0) { tickSec = sec; sfx('tick'); }
    if (q.timeLeft <= 0) { q.timeLeft = 0; UI.announce('Time is up.'); Game.answer('timeout'); if (st.mode !== 'trail') Quiz.settle(); }
    UI.updateTimerBar();
  }
  R.frame(dt, st);
  requestAnimationFrame(loop);
}

// ---------- test hooks ----------
function publicState() {
  const st = G.state; const t = st.trail;
  return JSON.parse(JSON.stringify({
    scene: st.scene, mode: st.mode, settings: st.settings, asked: st.asked,
    trail: t ? { target: t.target, round: t.round, turn: t.turn, phase: t.phase, roll: t.roll, rerolled: t.rerolled, sel: t.sel,
      dests: t.dests.map((d) => d.node), destPaths: t.dests.map((d) => d.path),
      players: t.players.map(({ id, name, kind, level, node, stamps, tickets, skill, skip, correct, answered, shape, color }) => ({ id, name, kind, level, node, stamps, tickets, skill, skip, correct, answered, shape, color })),
      pending: t.pending, winner: t.winner, log: t.log.slice(0, 6) } : null,
    question: st.question, quiz: st.quiz,
    board: { nodes: NODES.length, start: START, tower: TOWER, trailhead: TRAILHEAD, spurEntry: SPUR_ENTRY, trolleys: TROLLEYS, landmarks: LANDMARK, vents: VENT_PAIRS,
      types: NODES.map((n) => n.type), cats: NODES.map((n) => n.cat || null), costs: NODES.map((n) => n.cost) },
    ui: { modal: ui.modal, menu: ui.menuOpen, camera: R.view.mode, reduced: R.view.reduced, theme: document.body.dataset.theme, focus: document.activeElement ? (document.activeElement.dataset.key || document.activeElement.id || document.activeElement.tagName) : null },
    bank: BANK.length, storage: G.save.ok, audio: { ...audioStats },
    art: { enabled: ART.enabled, pending: ART.pending, failed: ART.failed.slice(), loaded: Object.keys(ART.imgs).filter((k) => ART.imgs[k].ok) },
  }));
}

window.__game = {
  seed(n) { G.state.rngSeed = n; G.rng = makeRng(n); return n; },
  getState: publicState,
  setState(s) {
    const st = G.state;
    if (s.settings) { Object.assign(st.settings, s.settings); applySettings(); }
    if (s.trail && st.trail) {
      const { players, ...rest } = s.trail;
      Object.assign(st.trail, rest);
      if (players) players.forEach((pp, i) => { if (pp && st.trail.players[i]) { Object.assign(st.trail.players[i], pp); if (pp.node !== undefined) { const n = NODES[pp.node]; const tp = R.tokenPos(st.trail.players[i]); tp.x = n.x; tp.y = n.y; } } });
    }
    if (s.question !== undefined) st.question = s.question === null ? null : Object.assign(st.question || {}, s.question);
    if (s.asked) st.asked = s.asked.slice();
    UI.update(); return true;
  },
  // Idle = no tween, camera settled, board art decoded, and the modal's 0.22 s rise transition has finished.
  isIdle() { const now = performance.now(); return !R.isAnimating() && R.camSettled() && !R.artBusy() && (R.view.reduced || (now - ui.modalAt > 300 && now - ui.revealAt > 760 && now - (ui.answerAt || 0) > 1000)); },
  scene(name) { scene(name); return G.state.scene; },
  newGame(opts = {}) {
    if (opts.seed !== undefined) this.seed(opts.seed);
    const mode = opts.mode || 'trail';
    if (mode === 'trail') startTrail({ players: opts.players, target: opts.target || 6 });
    else if (mode === 'daily') startQuiz('daily', { date: opts.date || G.today() });
    else startQuiz(mode, { era: opts.era });
    return publicState();
  },
  act(name, ...args) {
    const t = G.state.trail;
    switch (name) {
      case 'roll': return Game.roll(args[0]);
      case 'choose': return Game.choose(args[0]);
      case 'chooseIndex': return t && t.dests[args[0]] ? Game.choose(t.dests[args[0]].node) : false;
      case 'answer': { const r = Game.answer(args[0]); if (r && G.state.mode !== 'trail') Quiz.settle(); return r; }
      case 'continue': if (G.state.scene === 'quiz') { Quiz.next(); return true; } return Game.proceed();
      case 'wager': return Game.setWager(args[0]);
      case 'order': return Game.order(args[0]);
      case 'orderCorrect': { const ev = t.pending.events; return Game.order([0, 1, 2].sort((a, b) => ev[a].y - ev[b].y)); }
      case 'vent': return Game.vent(args[0]);
      case 'warp': return Game.warp(args[0]);
      case 'trolley': return Game.trolley(args[0]);
      case 'reroll': return Game.reroll();
      case 'lifeline': return Game.lifeline();
      case 'pass': Game.pass(); return true;
      case 'finishAnim': R.finishAnims(); return true;
      case 'ui': act(args[0], args[1]); return true;
      case 'stopAI': Game.stopAI(); return true;
      case 'adj': return ADJ[args[0]].slice();
      case 'aiSample': return Game.aiAccuracySample(args[0], args[1]);
      // board geometry for tests: node positions and radii (board units), and a node's position on screen (CSS px)
      case 'geo': return { w: BOARD_W, h: BOARD_H, squash: GEO_META ? GEO_META.squash : 0.87, horizon: GEO_META && GEO_META.horizon || 0, tracks: GEO_META ? GEO_META.tracks || [] : [],
        edges: GEO_META ? GEO_META.edges : [], nodes: NODES.map((n) => ({ x: n.x, y: n.y, r: R.spaceR(n), type: n.type })) };
      case 'screenOf': { const n = NODES[args[0]]; const [x, y] = R.worldToScreen(n.x, n.y); const r = document.querySelector('#board').getBoundingClientRect(); return [r.left + x, r.top + y]; }
      default: return false;
    }
  },
  fpsFrames: () => fpsFrames,
};

// ---------- boot ----------
function boot() {
  G.save.load();
  G.state = newState();
  G.rng = makeRng((Date.now() ^ 0x5eed) >>> 0);
  R.initView(document.querySelector('#board'));
  G.view = R.view;
  applySettings();
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => applySettings());
    window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', () => applySettings());
  }
  wireInput();
  scene('title');
  requestAnimationFrame(loop);
}
boot();

return {  };
})();
